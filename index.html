<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rabbit Hole</title>
    <style>
        /* ==========================================
           CORE STYLES & RESET (BEM / Scoped)
           ================================---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0A0A0C;
            color: #F3F4F6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Ambient Glow Background Accents */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(6, 182, 212, 0.05) 50%, transparent 80%);
            z-index: -1;
            pointer-events: none;
        }

        /* Hero Header Section */
        .rabbit-hero {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 1rem;
        }

        .rabbit-hero__title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #F3F4F6;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.6), 0 0 40px rgba(6, 182, 212, 0.3);
            animation: rabbit-pulseGlow 3s ease-in-out infinite alternate;
            margin-bottom: 0.5rem;
        }

        .rabbit-hero__subtitle {
            font-size: 1.1rem;
            color: #9CA3AF;
            font-weight: 400;
        }

        @keyframes rabbit-pulseGlow {
            0% {
                text-shadow: 0 0 15px rgba(168, 85, 247, 0.4), 0 0 30px rgba(6, 182, 212, 0.2);
            }
            100% {
                text-shadow: 0 0 25px rgba(168, 85, 247, 0.8), 0 0 50px rgba(6, 182, 212, 0.5);
            }
        }

        /* Main Action Trigger */
        .rabbit-trigger-container {
            margin-bottom: 3rem;
            display: flex;
            justify-content: center;
        }

        .rabbit-btn {
            background: linear-gradient(135deg, #A855F7 0%, #06B6D4 100%);
            color: #0A0A0C;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .rabbit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.7);
        }

        .rabbit-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Modular Content Container */
        .rabbit-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .rabbit-card {
            background: rgba(18, 18, 24, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none; /* Hidden by default until loaded */
        }

        .rabbit-card.is-active {
            display: block;
            animation: rabbit-fadeIn 0.5s ease forwards;
        }

        @keyframes rabbit-fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Placeholder state for container */
        .rabbit-placeholder {
            text-align: center;
            color: #6B7280;
            font-style: italic;
            padding: 3rem;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        <!-- MODULES INSERT BELOW THIS LINE -->
    </style>
</head>
<body>

    <!-- Hero Header -->
    <header class="rabbit-hero">
        <h1 class="rabbit-hero__title">The Rabbit Hole</h1>
        <p class="rabbit-hero__subtitle">Click to plunge into the unknown.</p>
    </header>

    <!-- Main Trigger Button -->
    <div class="rabbit-trigger-container">
        <button id="rabbit-hole-btn" class="rabbit-btn">Drop Me Down 🔮</button>
    </div>

    <!-- Dynamic Modular Display Area -->
    <main id="content-display" class="rabbit-content">
        <div class="rabbit-placeholder">The rabbit hole is waiting... Hit the button above to begin your journey.</div>
    </main>

    <script>
        /* ==========================================
           GLOBAL JAVASCRIPT STATE ENGINE
           ================================---------- */
        window.RabbitHole = {
            modules: [],
            current: 0,
            
            // Register a new interactive module
            registerModule: function(moduleObj) {
                this.modules.push(moduleObj);
            },

            // Load a module by its identifier or index
            loadModule: function(identifier) {
                const displayArea = document.getElementById('content-display');
                if (!displayArea) return;

                let targetModule;
                if (typeof identifier === 'number') {
                    this.current = identifier;
                    targetModule = this.modules[this.current];
                } else {
                    targetModule = this.modules.find(m => m.id === identifier);
                    if (targetModule) {
                        this.current = this.modules.indexOf(targetModule);
                    }
                }

                if (!targetModule) return;

                // Clear container and render module HTML template or DOM element
                displayArea.innerHTML = '';
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'rabbit-card is-active';
                cardWrapper.innerHTML = targetModule.render();
                displayArea.appendChild(cardWrapper);

                // Execute any lifecycle mount hook if defined
                if (typeof targetModule.onMount === 'function') {
                    targetModule.onMount(cardWrapper);
                }
            },

            // Random teleportation trigger
            randomize: function() {
                if (this.modules.length === 0) return;
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * this.modules.length);
                } while (randomIndex === this.current && this.modules.length > 1);
                
                this.loadModule(randomIndex);
            },

            // Initialize event bindings
            init: function() {
                const triggerBtn = document.getElementById('rabbit-hole-btn');
                if (triggerBtn) {
                    triggerBtn.addEventListener('click', () => {
                        if (this.modules.length === 0) {
                            alert("No modules loaded yet! Ready for upcoming stackable blocks.");
                            return;
                        }
                        this.randomize();
                    });
                }
            }
        };

        // Auto-initialize core state engine on DOM content loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.RabbitHole.init();
        });

        // JAVASCRIPT MODULES GO HERE
    </script>
</body>
</html>

    <script>
        // Self-register Module 1 into window.RabbitHole architecture
        (function() {
            const whatIfModule = {
                id: 'what-if-sandbox',
                
                render: function() {
                    return `
                        <div class="sandbox-card">
                            <div class="sandbox-header">
                                <h3 class="sandbox-title">🌌 What-If Physics Sandbox</h3>
                                <span class="sandbox-hint">Click canvas to spawn energy</span>
                            </div>
                            <div class="sandbox-canvas-wrap">
                                <canvas id="sandbox-canvas-el" class="sandbox-canvas"></canvas>
                            </div>
                            <div class="sandbox-controls">
                                <div class="sandbox-control-group">
                                    <label class="sandbox-label">Gravity Level: <span id="val-gravity">0.3</span></label>
                                    <input type="range" id="slider-gravity" class="sandbox-slider" min="-0.5" max="1.0" step="0.05" value="0.3">
                                </div>
                                <div class="sandbox-control-group">
                                    <label class="sandbox-label">Particle Elasticity: <span id="val-elasticity">0.8</span></label>
                                    <input type="range" id="slider-elasticity" class="sandbox-slider" min="0.1" max="1.0" step="0.05" value="0.8">
                                </div>
                            </div>
                            <div class="sandbox-action-row">
                                <span class="sandbox-hint">Simulating autonomous neon particles in real time.</span>
                                <button id="sandbox-reset" class="sandbox-reset-btn">Respawn Particles</button>
                            </div>
                        </div>
                    `;
                },

                onMount: function(wrapperEl) {
                    const canvas = wrapperEl.querySelector('#sandbox-canvas-el');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');

                    // Set canvas internal resolution matching layout size
                    function resizeCanvas() {
                        canvas.width = canvas.clientWidth;
                        canvas.height = canvas.clientHeight;
                    }
                    resizeCanvas();
                    window.addEventListener('resize', resizeCanvas);

                    // Physics state variables
                    let particles = [];
                    const particleCount = 35;
                    const colors = ['#A855F7', '#06B6D4', '#EC4899', '#3B82F6', '#10B981'];

                    function initParticles() {
                        particles = [];
                        for (let i = 0; i < particleCount; i++) {
                            particles.push({
                                x: Math.random() * (canvas.width - 40) + 20,
                                y: Math.random() * (canvas.height - 40) + 20,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                radius: Math.random() * 8 + 6,
                                color: colors[Math.floor(Math.random() * colors.length)]
                            });
                        }
                    }
                    initParticles();

                    // Slider DOM references
                    const gravitySlider = wrapperEl.querySelector('#slider-gravity');
                    const elasticitySlider = wrapperEl.querySelector('#slider-elasticity');
                    const valGravity = wrapperEl.querySelector('#val-gravity');
                    const valElasticity = wrapperEl.querySelector('#val-elasticity');
                    const resetBtn = wrapperEl.querySelector('#sandbox-reset');

                    let animationFrameId;

                    // Simulation Loop
                    function loop() {
                        const gravity = parseFloat(gravitySlider.value);
                        const elasticity = parseFloat(elasticitySlider.value);

                        valGravity.textContent = gravity.toFixed(2);
                        valElasticity.textContent = elasticity.toFixed(2);

                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        // Update & Draw Particles
                        for (let i = 0; i < particles.length; i++) {
                            let p = particles[i];

                            // Apply gravity
                            p.vy += gravity;
                            
                            // Apply drag damping
                            p.vx *= 0.99;
                            p.vy *= 0.99;

                            p.x += p.vx;
                            p.y += p.vy;

                            // Wall boundaries collision with elasticity
                            if (p.x - p.radius < 0) {
                                p.x = p.radius;
                                p.vx *= -elasticity;
                            } else if (p.x + p.radius > canvas.width) {
                                p.x = canvas.width - p.radius;
                                p.vx *= -elasticity;
                            }

                            if (p.y - p.radius < 0) {
                                p.y = p.radius;
                                p.vy *= -elasticity;
                            } else if (p.y + p.radius > canvas.height) {
                                p.y = canvas.height - p.radius;
                                p.vy *= -elasticity;
                            }

                            // Render Glowing Ball
                            ctx.save();
                            ctx.shadowBlur = 12;
                            ctx.shadowColor = p.color;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                            ctx.fillStyle = p.color;
                            ctx.fill();
                            ctx.restore();
                        }

                        animationFrameId = requestAnimationFrame(loop);
                    }
                    loop();

                    // Click to spawn burst
                    canvas.addEventListener('click', (e) => {
                        const rect = canvas.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const clickY = e.clientY - rect.top;

                        for (let i = 0; i < 5; i++) {
                            particles.push({
                                x: clickX,
                                y: clickY,
                                vx: (Math.random() - 0.5) * 10,
                                vy: (Math.random() - 0.5) * 10,
                                radius: Math.random() * 10 + 5,
                                color: colors[Math.floor(Math.random() * colors.length)]
                            });
                        }
                        if (particles.length > 80) particles.splice(0, 5);
                    });

                    resetBtn.addEventListener('click', initParticles);

                    // Clean up animation frame when module unloads
                    const originalUnload = whatIfModule.onUnload;
                    whatIfModule.onUnload = function() {
                        cancelAnimationFrame(animationFrameId);
                        window.removeEventListener('resize', resizeCanvas);
                        if (typeof originalUnload === 'function') originalUnload();
                    };
                }
            };

            // Register module into global state
            if (window.RabbitHole && typeof window.RabbitHole.registerModule === 'function') {
                window.RabbitHole.registerModule(whatIfModule);
            }
        })();
    </script>

    <script>
        // Self-register Module 8 into window.RabbitHole architecture
        (function() {
            const matrixChillModule = {
                id: 'matrix-chill',

                render: function() {
                    return `
                        <div class="matrix-card">
                            <div class="matrix-header">
                                <h3 class="matrix-title">💻 Matrix Rain & Ambient Rain</h3>
                                <span class="matrix-hint">Procedural Synthesis</span>
                            </div>
                            
                            <div class="matrix-canvas-wrap">
                                <canvas id="matrix-canvas-el" class="matrix-canvas"></canvas>
                            </div>

                            <div class="matrix-controls-grid">
                                <div class="matrix-control-group">
                                    <label class="matrix-label">Fall Velocity Speed: <span id="val-matrix-speed">33</span>ms</label>
                                    <input type="range" id="slider-matrix-speed" class="matrix-slider" min="15" max="80" step="5" value="33">
                                </div>
                                <div style="display: flex; align-items: flex-end;">
                                    <button id="matrix-audio-toggle" class="matrix-audio-btn" style="width: 100%;">
                                        <span>🌧️</span> Play Ambient Rain
                                    </button>
                                </div>
                            </div>

                            <span class="matrix-hint">Immersive green character cascades paired with procedural white-noise rain synthesis.</span>
                        </div>
                    `;
                },

                onMount: function(wrapperEl) {
                    const canvas = wrapperEl.querySelector('#matrix-canvas-el');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');

                    function resizeCanvas() {
                        canvas.width = canvas.clientWidth;
                        canvas.height = canvas.clientHeight;
                    }
                    resizeCanvas();
                    window.addEventListener('resize', resizeCanvas);

                    // Matrix Characters (Latin, Katakana, Numbers, Math symbols)
                    const chars = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/?[]*+@#$';
                    const fontSize = 14;
                    let columns = Math.floor(canvas.width / fontSize);
                    let drops = [];

                    function initDrops() {
                        columns = Math.floor(canvas.width / fontSize);
                        drops = [];
                        for (let i = 0; i < columns; i++) {
                            drops[i] = Math.floor(Math.random() * -50);
                        }
                    }
                    initDrops();

                    const speedSlider = wrapperEl.querySelector('#slider-matrix-speed');
                    const valSpeed = wrapperEl.querySelector('#val-matrix-speed');
                    let lastTime = 0;
                    let animationFrameId;

                    function drawMatrix(timestamp) {
                        const interval = parseInt(speedSlider.value);
                        valSpeed.textContent = interval;

                        if (!lastTime) lastTime = timestamp;
                        const elapsed = timestamp - lastTime;

                        if (elapsed > interval) {
                            lastTime = timestamp - (elapsed % interval);

                            // Semi-transparent black fade to create tail effect
                            ctx.fillStyle = 'rgba(5, 5, 8, 0.12)';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);

                            ctx.fillStyle = '#10B981'; // Neon Matrix Green
                            ctx.font = fontSize + 'px monospace';

                            for (let i = 0; i < drops.length; i++) {
                                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                                const x = i * fontSize;
                                const y = drops[i] * fontSize;

                                // Lead character highlight
                                if (Math.random() > 0.85) {
                                    ctx.fillStyle = '#A7F3D0';
                                } else {
                                    ctx.fillStyle = '#10B981';
                                }

                                ctx.fillText(text, x, y);

                                if (y > canvas.height && Math.random() > 0.975) {
                                    drops[i] = 0;
                                }
                                drops[i]++;
                            }
                        }

                        animationFrameId = requestAnimationFrame(drawMatrix);
                    }
                    animationFrameId = requestAnimationFrame(drawMatrix);

                    // Web Audio API Procedural Rain (White Noise + LowPass Filter)
                    let audioCtx = null;
                    let noiseNode = null;
                    let filterNode = null;
                    let gainNode = null;
                    let isPlayingAudio = false;
                    const audioBtn = wrapperEl.querySelector('#matrix-audio-toggle');

                    function toggleAmbientRain() {
                        if (!audioCtx) {
                            const AudioContext = window.AudioContext || window.webkitAudioContext;
                            audioCtx = new AudioContext();
                        }
                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume();
                        }

                        if (!isPlayingAudio) {
                            // Create White Noise buffer (2 seconds)
                            const bufferSize = audioCtx.sampleRate * 2;
                            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                            const output = buffer.getChannelData(0);
                            for (let i = 0; i < bufferSize; i++) {
                                output[i] = Math.random() * 2 - 1;
                            }

                            noiseNode = audioCtx.createBufferSource();
                            noiseNode.buffer = buffer;
                            noiseNode.loop = true;

                            // Biquad Filter to simulate soft falling rain (Low Pass)
                            filterNode = audioCtx.createBiquadFilter();
                            filterNode.type = 'lowpass';
                            filterNode.frequency.value = 850;

                            gainNode = audioCtx.createGain();
                            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);

                            noiseNode.connect(filterNode);
                            filterNode.connect(gainNode);
                            gainNode.connect(audioCtx.destination);

                            noiseNode.start();
                            isPlayingAudio = true;
                            audioBtn.innerHTML = '<span>⏸️</span> Pause Ambient Rain';
                            audioBtn.style.background = 'rgba(16, 185, 129, 0.3)';
                        } else {
                            if (noiseNode) {
                                noiseNode.stop();
                                noiseNode.disconnect();
                            }
                            isPlayingAudio = false;
                            audioBtn.innerHTML = '<span>🌧️</span> Play Ambient Rain';
                            audioBtn.style.background = 'rgba(16, 185, 129, 0.15)';
                        }
                    }

                    audioBtn.addEventListener('click', toggleAmbientRain);

                    // Cleanup hook on unmount
                    const originalUnload = matrixChillModule.onUnload;
                    matrixChillModule.onUnload = function() {
                        cancelAnimationFrame(animationFrameId);
                        window.removeEventListener('resize', resizeCanvas);
                        if (isPlayingAudio && noiseNode) {
                            try { noiseNode.stop(); } catch(e) {}
                        }
                        if (audioCtx && audioCtx.state !== 'closed') {
                            audioCtx.close();
                        }
                        if (typeof originalUnload === 'function') originalUnload();
                    };
                }
            };

            // Register module into global state
            if (window.RabbitHole && typeof window.RabbitHole.registerModule === 'function') {
                window.RabbitHole.registerModule(matrixChillModule);
            }
        })();
    </script>
