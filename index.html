<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pocket Voxel Engine - Ultimate Edition (AK-47 & RPG)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            touch-action: none;
        }
        canvas { display: block; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 2px #000;
        }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        #damage-flash {
            position: absolute; inset: 0;
            background: rgba(220, 0, 0, 0.45);
            pointer-events: none; opacity: 0;
            transition: opacity 0.15s ease-out; z-index: 15;
        }
        #toast-msg {
            position: absolute; top: 52px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #ffff55;
            padding: 6px 14px; border-radius: 6px;
            font-size: 12px; font-weight: bold; pointer-events: none;
            opacity: 0; transition: opacity 0.25s; z-index: 30;
        }

        /* HUD & Touch Controls */
        #ui-layer {
            position: absolute; inset: 0;
            pointer-events: none; display: flex;
            flex-direction: column; justify-content: space-between;
            padding: 10px; z-index: 10;
        }
        #top-hud {
            display: flex; justify-content: space-between; align-items: center;
            color: white; text-shadow: 1px 1px 2px #000;
            font-weight: bold; font-size: 11px;
            background: rgba(0,0,0,0.35); padding: 6px 8px;
            border-radius: 6px; gap: 4px;
        }
        .hud-btn-group { pointer-events: auto; display: flex; gap: 4px; }
        .mini-btn {
            background: #3e7a3e; color: white; border: 1px solid #a5d6a7;
            border-radius: 4px; padding: 3px 6px; font-size: 10px; font-weight: bold; cursor: pointer;
        }
        .mini-btn.reset { background: #8e3535; border-color: #ef9a9a; }
        .mini-btn:active { transform: scale(0.95); }

        #controls-row {
            display: flex; justify-content: space-between; align-items: flex-end; width: 100%;
        }
        .dpad {
            pointer-events: auto; display: grid;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(3, 52px); gap: 4px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-radius: 10px; color: white; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px);
        }
        .btn:active { background: rgba(255, 255, 255, 0.6); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        .action-group {
            pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        }
        .action-row { display: flex; gap: 8px; }
        .action-btn {
            width: 58px; height: 58px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.7);
            color: white; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.4); }
        #btn-shoot {
            background: rgba(190, 40, 40, 0.85);
            border-color: #ff8a80;
            display: none;
        }

        #status-bars {
            align-self: center; display: flex; justify-content: space-between;
            width: 100%; max-width: 320px; margin-top: 4px;
            padding: 2px 4px; font-size: 12px; letter-spacing: 1px; text-shadow: 1px 1px 0 #000;
        }

        #hotbar-container {
            pointer-events: auto; align-self: center; display: flex; gap: 4px;
            background: rgba(30, 30, 30, 0.85); padding: 4px; border: 3px solid #555;
            border-radius: 6px; margin-top: 2px;
        }
        .slot {
            width: 44px; height: 44px; background: #8b8b8b;
            border: 2px solid #373737; border-right-color: #fff; border-bottom-color: #fff;
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .slot.selected { border: 3px solid #ffff55; transform: scale(1.06); }
        .item-icon {
            width: 24px; height: 24px; border: 1px solid rgba(0,0,0,0.4);
            background-size: cover; image-rendering: pixelated;
        }
        .item-count {
            position: absolute; bottom: 2px; right: 4px; color: white;
            font-size: 10px; font-weight: bold; text-shadow: 1px 1px 0 #000;
        }
        .item-label {
            font-size: 7px; color: #fff; text-shadow: 1px 1px 0 #000;
            margin-top: 1px; text-align: center; line-height: 1;
        }

        #crafting-modal, #death-modal {
            display: none; position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.7); z-index: 25;
            align-items: center; justify-content: center; padding: 15px;
        }
        #death-modal { background: rgba(110, 0, 0, 0.8); flex-direction: column; color: white; text-align: center; }
        #respawn-btn {
            margin-top: 16px; padding: 12px 28px; font-size: 16px; font-weight: bold;
            background: #777; color: white; border: 3px solid #fff; cursor: pointer;
        }
        .window-box {
            background: #c6c6c6; border: 4px solid #373737;
            border-top-color: #fff; border-left-color: #fff;
            padding: 16px; width: 100%; max-width: 380px; color: #222;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-weight: bold; font-size: 15px;
        }
        .close-btn {
            background: #aa3333; color: white; border: 2px solid #550000;
            padding: 4px 10px; font-weight: bold; cursor: pointer;
        }
        .window-content {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; margin-bottom: 14px; background: #b0b0b0; padding: 12px; border: 2px solid #777;
        }
        .recipe-hints { font-size: 11px; background: #dcdcdc; padding: 8px; border: 1px solid #888; margin-bottom: 10px; line-height: 1.4; }
        .modal-inventory { display: flex; justify-content: center; gap: 5px; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="damage-flash"></div>
    <div id="toast-msg">Loaded AK-47 & RPG!</div>

    <div id="ui-layer">
        <div id="top-hud">
            <span id="zone-label">Los Santos Hills</span>
            <span id="time-label">Day 12:00</span>
            <div class="hud-btn-group">
                <button class="mini-btn" id="btn-save">Save</button>
                <button class="mini-btn reset" id="btn-reset">Reset</button>
            </div>
        </div>

        <div style="display:flex; flex-direction:column; width:100%;">
            <div id="controls-row">
                <div class="dpad">
                    <div class="btn" id="btn-up">W</div>
                    <div class="btn" id="btn-left">A</div>
                    <div class="btn" id="btn-right">D</div>
                    <div class="btn" id="btn-down">S</div>
                </div>
                <div class="action-group">
                    <div class="action-row">
                        <div class="action-btn" id="btn-shoot">Shoot</div>
                        <div class="action-btn" id="btn-break">Break /<br>Hit</div>
                        <div class="action-btn" id="btn-place">Place</div>
                    </div>
                    <div class="action-row">
                        <div class="action-btn" id="btn-jump">Jump</div>
                    </div>
                </div>
            </div>

            <div id="status-bars">
                <div id="health-bar" style="color:#ff3333;">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
                <div id="hunger-bar" style="color:#d28e46;">🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</div>
            </div>

            <div id="hotbar-container">
                <div class="slot selected" data-slot="0" id="hotbar-0"></div>
                <div class="slot" data-slot="1" id="hotbar-1"></div>
                <div class="slot" data-slot="2" id="hotbar-2"></div>
                <div class="slot" data-slot="3" id="hotbar-3"></div>
                <div class="slot" id="hotbar-4" id="hotbar-4"></div>
                <div class="slot" id="btn-open-craft" style="background:#5a5a5a; color:#fff; font-weight:bold;">
                    <span>•••</span>
                    <span class="item-label">Craft</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Death Screen -->
    <div id="death-modal">
        <h1 style="font-size:32px; margin:0; text-shadow:2px 2px 0 #000;">WASTED / YOU DIED!</h1>
        <button id="respawn-btn">Respawn on Island</button>
    </div>

    <!-- Crafting Modal -->
    <div id="crafting-modal">
        <div class="window-box">
            <div class="modal-header">
                <span>Crafting (2x2)</span>
                <button class="close-btn" id="close-craft">X</button>
            </div>
            <div class="window-content">
                <div id="craft-grid" style="display:grid; grid-template-columns:repeat(2,50px); grid-template-rows:repeat(2,50px); gap:4px;">
                    <div class="slot" id="craft-0"></div><div class="slot" id="craft-1"></div>
                    <div class="slot" id="craft-2"></div><div class="slot" id="craft-3"></div>
                </div>
                <div style="font-size:24px; font-weight:bold; color:#444;">➔</div>
                <div class="slot" id="craft-output" style="width:56px; height:56px;"></div>
            </div>
            <div class="recipe-hints">4 Wood = Table | 2 Iron = AK-47 | 4 Iron = GTA V RPG</div>
            <div style="font-size:12px; font-weight:bold; margin-bottom:4px;">Inventory:</div>
            <div class="modal-inventory" id="modal-inventory"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const SAVE_KEY = 'pocket_voxel_gta_island_v5';
        function showToast(text) {
            const t = document.getElementById('toast-msg');
            t.textContent = text; t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 1800);
        }

        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, endFreq, duration, type = 'square', vol = 0.12) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
            gunshot() { this.playTone(120, 30, 0.08, 'sawtooth', 0.2); }
            explosion() {
                this.init();
                const bufferSize = this.ctx.sampleRate * 0.6;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 300;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            }
            breakBlock() { this.playTone(180, 70, 0.12, 'sawtooth', 0.15); }
            placeBlock() { this.playTone(260, 420, 0.08, 'triangle', 0.15); }
            jump()       { this.playTone(150, 320, 0.14, 'sine', 0.1); }
            mobHit()     { this.playTone(300, 110, 0.16, 'sawtooth', 0.18); }
        }
        const sfx = new SoundFX();

        function createPixelTexture(draw) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            draw(ctx);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const textures = {
            grass_top: createPixelTexture(ctx => { ctx.fillStyle = '#55aa33'; ctx.fillRect(0,0,16,16); }),
            grass_side: createPixelTexture(ctx => { ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0,0,16,16); ctx.fillStyle = '#55aa33'; ctx.fillRect(0,0,16,5); }),
            dirt: createPixelTexture(ctx => { ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0,0,16,16); }),
            stone: createPixelTexture(ctx => { ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0,0,16,16); }),
            wood: createPixelTexture(ctx => { ctx.fillStyle = '#6b4226'; ctx.fillRect(0,0,16,16); }),
            sand: createPixelTexture(ctx => { ctx.fillStyle = '#e6d28a'; ctx.fillRect(0,0,16,16); }),
            table: createPixelTexture(ctx => { ctx.fillStyle = '#a0522d'; ctx.fillRect(0,0,16,16); }),
            ak47: createPixelTexture(ctx => {
                ctx.fillStyle = '#424242'; ctx.fillRect(2,7,12,3);
                ctx.fillStyle = '#6b4226'; ctx.fillRect(3,10,3,4);
            }),
            rpg: createPixelTexture(ctx => {
                ctx.fillStyle = '#33691e'; ctx.fillRect(1,6,14,4);
                ctx.fillStyle = '#212121'; ctx.fillRect(12,5,3,6); ctx.fillRect(3,9,3,4);
            })
        };

        function getBlockMaterials(type) {
            if (type === 'grass') {
                return [
                    new THREE.MeshLambertMaterial({ map: textures.grass_side }),
                    new THREE.MeshLambertMaterial({ map: textures.grass_side }),
                    new THREE.MeshLambertMaterial({ map: textures.grass_top }),
                    new THREE.MeshLambertMaterial({ map: textures.dirt }),
                    new THREE.MeshLambertMaterial({ map: textures.grass_side }),
                    new THREE.MeshLambertMaterial({ map: textures.grass_side })
                ];
            }
            return new THREE.MeshLambertMaterial({ map: textures[type] || textures.stone });
        }

        const ITEMS = {
            grass: { name: 'Grass', placeable: true }, dirt: { name: 'Dirt', placeable: true },
            stone: { name: 'Stone', placeable: true }, wood: { name: 'Wood', placeable: true },
            sand: { name: 'Sand', placeable: true }, table: { name: 'Table', placeable: true },
            ak47: { name: 'AK-47', placeable: false, ranged: true, damage: 2, fireRate: 150 },
            rpg:  { name: 'GTA RPG', placeable: false, ranged: true, damage: 10, explosive: true, fireRate: 800 }
        };

        let inventory = [
            { id: 'ak47', count: 1 },
            { id: 'rpg', count: 1 },
            { id: 'wood', count: 10 },
            { id: 'grass', count: 15 },
            null
        ];
        let selectedSlot = 0, craftGrid = [null,null,null,null], craftResult = null;
        let lastShotTime = 0;

        let scene, camera, renderer, raycaster, highlightBox, dirLight, ambientLight;
        let blockMap = new Map(), blockMeshes = [], mobs = [], mobHitboxes = [];
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3(), position = new THREE.Vector3(0, 8, 14), rotation = { x: -0.15, y: 0 };
        let playerHealth = 10, playerHunger = 10, isDead = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.018);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 600);
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
            dirLight = new THREE.DirectionalLight(0xffffff, 0.75); dirLight.position.set(60, 100, 40); scene.add(dirLight);

            const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02, 1.02, 1.02));
            highlightBox = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            highlightBox.visible = false; scene.add(highlightBox);

            raycaster = new THREE.Raycaster(); raycaster.far = 60;

            generateIsland();
            spawnInitialMobs();
            setupControls(); setupUI(); renderInventory(); updateSurvivalBars();
        }

        function generateIsland() {
            const radius = 22;
            for (let x = -radius; x <= radius; x++) {
                for (let z = -radius; z <= radius; z++) {
                    const dist = Math.hypot(x / 18, z / 22);
                    if (dist > 1.05) continue;
                    const surfaceY = Math.max(-1, Math.floor((1 - dist) * 4.5 + Math.sin(x*0.2)*Math.cos(z*0.2)*2));
                    for (let y = -2; y <= surfaceY; y++) {
                        let type = (y === surfaceY) ? (surfaceY >= 5 ? 'stone' : (z > 12 ? 'sand' : 'grass')) : 'stone';
                        addBlock(x, y, z, type);
                    }
                }
            }
            position.set(0, getRawGroundY(0, 10) + 2.5, 10);
        }

        function addBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blockMap.has(key)) return;
            const mesh = new THREE.Mesh(blockGeo, getBlockMaterials(type));
            mesh.position.set(x, y, z);
            mesh.userData = { x, y, z, type };
            scene.add(mesh);
            blockMap.set(key, mesh);
            blockMeshes.push(mesh);
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            const mesh = blockMap.get(key);
            if (!mesh) return null;
            scene.remove(mesh);
            blockMap.delete(key);
            blockMeshes = blockMeshes.filter(m => m !== mesh);
            return mesh.userData.type;
        }

        function createMob(type, x, z) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.4, 1.1), new THREE.MeshLambertMaterial({ color: 0x4caf50 }));
            body.position.y = 0.7; group.add(body);
            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.9, 1.1), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.y = 0.7; group.add(hitbox);
            group.position.set(x, getRawGroundY(x, z), z);
            scene.add(group);
            const mobObj = { type, group, hitbox, hp: 5, yaw: Math.random() * Math.PI * 2 };
            hitbox.userData.mob = mobObj;
            mobs.push(mobObj); mobHitboxes.push(hitbox);
        }

        function spawnInitialMobs() {
            createMob('zombie', 6, -4);
            createMob('zombie', -6, 6);
        }

        function fireWeapon() {
            const now = Date.now();
            const held = inventory[selectedSlot];
            if (!held || !ITEMS[held.id].ranged) return;
            const weapon = ITEMS[held.id];
            if (now - lastShotTime < weapon.fireRate) return;
            lastShotTime = now;

            if (held.id === 'ak47') {
                sfx.gunshot();
            } else if (held.id === 'rpg') {
                sfx.explosion();
            }

            // Raycast shot
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const mobHits = raycaster.intersectObjects(mobHitboxes);
            if (mobHits.length > 0) {
                const mob = mobHits[0].object.userData.mob;
                mob.hp -= weapon.damage;
                sfx.mobHit();
                if (mob.hp <= 0) {
                    scene.remove(mob.group);
                    mobs = mobs.filter(x => x !== mob);
                    mobHitboxes = mobHitboxes.filter(h => h !== mob.hitbox);
                    showToast('Enemy Eliminated!');
                }
            } else if (weapon.explosive) {
                // Rocket Explosion (Destroys nearby blocks)
                const blockHits = raycaster.intersectObjects(blockMeshes);
                if (blockHits.length > 0) {
                    const hitPos = blockHits[0].object.position;
                    for (let x = -1; x <= 1; x++) {
                        for (let y = -1; y <= 1; y++) {
                            for (let z = -1; z <= 1; z++) {
                                removeBlock(Math.round(hitPos.x + x), Math.round(hitPos.y + y), Math.round(hitPos.z + z));
                            }
                        }
                    }
                }
            }
        }

        function updateSurvivalBars() {
            document.getElementById('health-bar').textContent = '❤️'.repeat(playerHealth) + '🖤'.repeat(10-playerHealth);
            document.getElementById('hunger-bar').textContent = '🍗'.repeat(playerHunger) + '🦴'.repeat(10-playerHunger);
        }

        function setupUI() {
            for(let i=0; i<5; i++) {
                document.getElementById(`hotbar-${i}`).addEventListener('click', () => { selectedSlot = i; renderInventory(); });
            }
            document.getElementById('btn-shoot').addEventListener('click', fireWeapon);
            document.getElementById('btn-save').addEventListener('click', () => showToast('World Saved!'));
            document.getElementById('btn-reset').addEventListener('click', () => location.reload());
            document.getElementById('respawn-btn').addEventListener('click', () => {
                playerHealth = 10; isDead = false; position.set(0, 7, 10);
                document.getElementById('death-modal').style.display = 'none'; updateSurvivalBars();
            });
            document.getElementById('btn-open-craft').addEventListener('click', () => {
                document.getElementById('crafting-modal').style.display = 'flex';
                renderCraftingModal();
            });
            document.getElementById('close-craft').addEventListener('click', () => {
                document.getElementById('crafting-modal').style.display = 'none';
            });
        }

        function renderSlotContent(el, item) {
            el.innerHTML = '';
            if (!item) return;
            const tex = textures[item.id] || textures.stone;
            el.innerHTML = `<div class="item-icon" style="background-image:url(${tex.image.toDataURL()});"></div><div class="item-label">${item.id}</div>${item.count > 1 ? `<div class="item-count">${item.count}</div>`:''}`;
        }

        function renderInventory() {
            for(let i=0; i<5; i++) {
                const el = document.getElementById(`hotbar-${i}`);
                el.classList.toggle('selected', i === selectedSlot);
                renderSlotContent(el, inventory[i]);
            }
            const held = inventory[selectedSlot];
            document.getElementById('btn-shoot').style.display = (held && ITEMS[held.id].ranged) ? 'flex' : 'none';
        }

        function renderCraftingModal() {
            const inv = document.getElementById('modal-inventory'); inv.innerHTML = '';
            for(let i=0; i<5; i++) {
                const slot = document.createElement('div'); slot.className = 'slot';
                renderSlotContent(slot, inventory[i]);
                inv.appendChild(slot);
            }
        }

        function setupControls() {
            const bind = (id, start, end) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', e => { e.preventDefault(); sfx.init(); start(); });
                el.addEventListener('touchend', e => { e.preventDefault(); end(); });
                el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
            };
            bind('btn-up', () => moveForward=true, () => moveForward=false);
            bind('btn-down', () => moveBackward=true, () => moveBackward=false);
            bind('btn-left', () => moveLeft=true, () => moveLeft=false);
            bind('btn-right', () => moveRight=true, () => moveRight=false);

            document.getElementById('btn-jump').addEventListener('click', () => {
                if(Math.abs(velocity.y) < 0.01) { velocity.y = 0.16; sfx.jump(); }
            });
            document.getElementById('btn-break').addEventListener('click', () => {
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = raycaster.intersectObjects(blockMeshes);
                if(hits.length > 0) {
                    const p = hits[0].object.userData;
                    removeBlock(p.x, p.y, p.z); sfx.breakBlock();
                }
            });
            document.getElementById('btn-place').addEventListener('click', () => {
                const item = inventory[selectedSlot];
                if(!item || !ITEMS[item.id].placeable) return;
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = raycaster.intersectObjects(blockMeshes);
                if(hits.length > 0) {
                    const hit = hits[0]; const n = hit.face.normal;
                    addBlock(hit.object.userData.x + Math.round(n.x), hit.object.userData.y + Math.round(n.y), hit.object.userData.z + Math.round(n.z), item.id);
                    sfx.placeBlock();
                    item.count--; if(item.count<=0) inventory[selectedSlot]=null;
                    renderInventory();
                }
            });

            let dragging = false, lx=0, ly=0;
            window.addEventListener('touchstart', e => {
                if(e.target.closest('#ui-layer') || e.target.closest('.window-box')) return;
                dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY;
            });
            window.addEventListener('touchmove', e => {
                if(!dragging) return;
                rotation.y -= (e.touches[0].clientX - lx) * 0.006;
                rotation.x = Math.max(-1.45, Math.min(1.45, rotation.x - (e.touches[0].clientY - ly) * 0.006));
                lx = e.touches[0].clientX; ly = e.touches[0].clientY;
            });
            window.addEventListener('touchend', () => dragging = false);
        }

        function getRawGroundY(px, pz) {
            const bx = Math.round(px), bz = Math.round(pz);
            for(let y=16; y>=-5; y--) if(blockMap.has(`${bx},${y},${bz}`)) return y+0.5;
            return -2.5;
        }

        function animate() {
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            if(moveForward) dir.z -= 1; if(moveBackward) dir.z += 1;
            if(moveLeft) dir.x -= 1; if(moveRight) dir.x += 1;
            if(dir.lengthSq() > 0) {
                dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0), rotation.y);
                position.x += dir.x * 0.11; position.z += dir.z * 0.11;
            }

            const floorY = getRawGroundY(position.x, position.z) + 1.7;
            velocity.y -= 0.009; position.y += velocity.y;
            if(position.y <= floorY) { position.y = floorY; velocity.y = 0; }

            camera.position.copy(position);
            camera.quaternion.setFromEuler(new THREE.Euler(rotation.x, rotation.y, 0, 'YXZ'));

            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(blockMeshes);
            highlightBox.visible = hits.length > 0;
            if(highlightBox.visible) highlightBox.position.copy(hits[0].object.position);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
