<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Playground</title>
    <style>
        :root {
            --green: #10B981;
            --blue: #3B82F6;
            --yellow: #F59E0B;
            --red: #EF4444;
            --bg: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        /* Floating background shapes */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
        }

        .orb-green { top: 10%; left: 10%; width: 250px; height: 250px; background: var(--green); }
        .orb-blue { top: 60%; right: 10%; width: 300px; height: 300px; background: var(--blue); }
        .orb-yellow { bottom: 10%; left: 20%; width: 200px; height: 200px; background: var(--yellow); }
        .orb-red { top: 30%; right: 25%; width: 220px; height: 220px; background: var(--red); }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        /* Container */
        .content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--green), var(--blue), var(--yellow), var(--red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        p.subtitle {
            color: #94A3B8;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        /* Interactive Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .btn {
            padding: 0.8rem 1.6rem;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-green { background: var(--green); }
        .btn-blue { background: var(--blue); }
        .btn-yellow { background: var(--yellow); color: #000; }
        .btn-red { background: var(--red); }

        /* Creative Image & Visual Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .visual-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .visual-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .card-icon {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .card-green .card-icon { background: linear-gradient(135deg, var(--green), #064e3b); }
        .card-blue .card-icon { background: linear-gradient(135deg, var(--blue), #1e3a8a); }
        .card-yellow .card-icon { background: linear-gradient(135deg, var(--yellow), #78350f); }
        .card-red .card-icon { background: linear-gradient(135deg, var(--red), #881337); }

        /* Interactive Quote Generator Display */
        .interactive-box {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2.5rem;
            margin-top: 1rem;
        }

        #quote-text {
            font-size: 1.4rem;
            font-style: italic;
            color: #e2e8f0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #64748B;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Dynamic Background Orbs -->
    <div class="bg-orb orb-green"></div>
    <div class="bg-orb orb-blue"></div>
    <div class="bg-orb orb-yellow"></div>
    <div class="bg-orb orb-red"></div>

    <div class="content">
        <h1>CREATIVE HUB</h1>
        <p class="subtitle">Click around, change the visual vibe, and explore!</p>

        <!-- Color Theme Controls -->
        <div class="controls">
            <button class="btn btn-green" onclick="setTheme('#062016')">Emerald Mode</button>
            <button class="btn btn-blue" onclick="setTheme('#071330')">Ocean Mode</button>
            <button class="btn btn-yellow" onclick="setTheme('#261a03')">Amber Mode</button>
            <button class="btn btn-red" onclick="setTheme('#210509')">Crimson Mode</button>
            <button class="btn" style="background:#334155" onclick="setTheme('#0b0f19')">Reset Vibe</button>
        </div>

        <!-- Interactive Visual Cards -->
        <div class="grid">
            <div class="visual-card card-green" onclick="cardClick('Forest Realm 🌲')">
                <div class="card-icon">🍃</div>
                <h3>Nature Matrix</h3>
                <p style="color:#94A3B8; font-size:0.9rem; margin-top:0.5rem;">Tap to inspect</p>
            </div>
            <div class="visual-card card-blue" onclick="cardClick('Deep Space 🌌')">
                <div class="card-icon">⚡</div>
                <h3>Energy Flux</h3>
                <p style="color:#94A3B8; font-size:0.9rem; margin-top:0.5rem;">Tap to inspect</p>
            </div>
            <div class="visual-card card-yellow" onclick="cardClick('Solar Flare ☀️')">
                <div class="card-icon">🔥</div>
                <h3>Light Stream</h3>
                <p style="color:#94A3B8; font-size:0.9rem; margin-top:0.5rem;">Tap to inspect</p>
            </div>
            <div class="visual-card card-red" onclick="cardClick('Magma Core 🌋')">
                <div class="card-icon">🎯</div>
                <h3>Focus Spark</h3>
                <p style="color:#94A3B8; font-size:0.9rem; margin-top:0.5rem;">Tap to inspect</p>
            </div>
        </div>

        <!-- Interactive Quote Engine -->
        <div class="interactive-box">
            <p id="quote-text">"Click the button below to generate a new thought burst."</p>
            <button class="btn btn-blue" style="margin-top: 1.5rem;" onclick="generateThought()">Spark Thought 💡</button>
        </div>

        <footer>
            Built for pure visual enjoyment • 2026
        </footer>
    </div>

    <script>
        // Change Background Vibe
        function setTheme(color) {
            document.body.style.backgroundColor = color;
        }

        // Interactive Card Click Effect
        function cardClick(title) {
            const display = document.getElementById('quote-text');
            display.innerText = "You unlocked: " + title + "!";
        }

        // Thought Generator Array
        const thoughts = [
            "“Creativity is intelligence having fun.” — Albert Einstein",
            "“Art enables us to find ourselves and lose ourselves at the same time.”",
            "“Every bold idea looks crazy right up until it works.”",
            "“Color is a power which directly influences the soul.” — Wassily Kandinsky",
            "“Curiosity is the wick in the candle of learning.”"
        ];

        function generateThought() {
            const randomIndex = Math.floor(Math.random() * thoughts.length);
            document.getElementById('quote-text').innerText = thoughts[randomIndex];
        }
    </script>
</body>
</html>
