<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ARCADE • Ultimate Snake Blaster RPG</title>
    <style>
        :root {
            --neon-red: #ff2a5f;
            --neon-orange: #ff7700;
            --neon-yellow: #ffe600;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --dark-bg: #050508;
            --panel-bg: rgba(20, 20, 30, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', Charcoal, sans-serif;
            letter-spacing: 1px;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1a082f 0%, var(--dark-bg) 75%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            text-transform: uppercase;
            font-style: italic;
            background: linear-gradient(180deg, #fff 20%, var(--neon-cyan) 60%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            margin-bottom: 0.1rem;
        }

        .subtitle {
            color: var(--neon-yellow);
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.4);
        }

        /* Top HUD Stats & Shop */
        .hud-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            font-size: 1.1rem;
        }

        .hud-panel span {
            color: var(--neon-yellow);
        }

        /* Upgrades Store Bar */
        .store-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .store-btn {
            background: linear-gradient(135deg, #005f73, var(--neon-cyan));
            border: none;
            color: #000;
            font-family: 'Impact', sans-serif;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: transform 0.1s;
        }

        .store-btn:hover {
            transform: scale(1.05);
        }

        /* Game Arena Canvas Container */
        .game-wrapper {
            background: rgba(10, 10, 20, 0.95);
            border: 3px solid var(--neon-purple);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(176, 0, 255, 0.3);
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #gameCanvas {
            background: #080812;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 100%;
            touch-action: none;
        }

        /* Arcade Touch Controls */
        .control-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-top: 10px;
            gap: 10px;
        }

        .ctrl-btn {
            background: linear-gradient(135deg, #005f73, var(--neon-cyan));
            border: none;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .fire-btn {
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-red));
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.5);
            flex: 1.5;
        }

        footer {
            margin-top: 1.5rem;
            color: #64748B;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEXUS ARCADE</h1>
        <p class="subtitle">⚡ Snake Blaster RPG • Mystery Boxes & Ultimate Weapons ⚡</p>

        <!-- HUD & Currency Panel -->
        <div class="hud-panel">
            <div>GOLD: <span id="goldVal">0</span> G</div>
            <div>WEAPON DMG: <span id="dmgVal">1</span></div>
            <div>FIRE SPEED: <span id="speedVal">1</span>x</div>
            <div>WAVE: <span id="waveVal">1</span></div>
        </div>

        <!-- Upgrades Shop -->
        <div class="store-bar">
            <button class="store-btn" onclick="buyDamageUpgrade()">Upgrade Damage (+1) [Cost: <span id="dmgCost">20</span>G]</button>
            <button class="store-btn" onclick="buySpeedUpgrade()">Upgrade Fire Rate [Cost: <span id="speedCost">35</span>G]</button>
            <button class="store-btn" style="background: linear-gradient(135deg, var(--neon-purple), var(--neon-red)); color:#fff;" onclick="toggleRockBeat()">🎵 Toggle Music</button>
        </div>

        <!-- Real-time Canvas Game -->
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="460" height="480"></canvas>

            <!-- Touch Controls for Mobile -->
            <div class="control-panel">
                <button class="ctrl-btn" onpointerdown="startMoveLeft()" onpointerup="stopMove()" onpointerleave="stopMove()">◄ LEFT</button>
                <button class="ctrl-btn fire-btn" onpointerdown="fireBall()">🔥 FIRE</button>
                <button class="ctrl-btn" onpointerdown="startMoveRight()" onpointerup="stopMove()" onpointerleave="stopMove()">RIGHT ►</button>
            </div>
        </div>

        <footer>
            NEXUS ARCADE • Shoot Brackets for Gold & Hit `?` Mystery Boxes for Ultimate Weapons!
        </footer>
    </div>

    <script>
        // --- Web Audio Synthesizer Engine ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isMusicPlaying = false;
        let beatTimer = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        const rockScale = [110.00, 130.81, 146.83, 164.81, 196.00, 220.00];

        function playBeat() {
            if (!isMusicPlaying) return;
            initAudio();
            const freq = rockScale[Math.floor(Math.random() * rockScale.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);

            beatTimer = setTimeout(playBeat, 220);
        }

        function toggleRockBeat() {
            initAudio();
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) playBeat();
            else clearTimeout(beatTimer);
        }

        function playSfx(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'fire') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            } else if (type === 'reward') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- Game Variables & RPG Economy ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let wave = 1;
        let gold = 0;
        let weaponDmg = 1;
        let fireSpeedLevel = 1;
        let gameOver = false;

        let dmgCost = 20;
        let speedCost = 35;

        // Player (Hero)
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 40,
            width: 30,
            height: 30,
            speed: 6,
            moveDir: 0,
            lastShot: 0
        };

        let fireballs = [];
        let particles = [];
        let floatingTexts = [];

        // Snake Setup
        let snakePath = [];
        const gridSize = 22;
        let snakeHeadX = 40;
        let snakeHeadY = 20;
        let snakeDirection = 'RIGHT';
        let moveTimer = 0;
        let moveInterval = 14;
        let totalBodySegments = 20;

        function initSnake() {
            snakePath = [];
            snakeHeadX = 40;
            snakeHeadY = 20;
            snakeDirection = 'RIGHT';

            for (let i = 0; i < totalBodySegments; i++) {
                // Randomly assign Mystery Box [?] to some segments
                let isMystery = (Math.random() < 0.2 && i > 2);
                let segmentHP = isMystery ? 20 : (5 + Math.floor(wave * 1.5));

                snakePath.push({
                    x: snakeHeadX - (i * gridSize),
                    y: snakeHeadY,
                    hp: segmentHP,
                    maxHp: segmentHP,
                    isMystery: isMystery
                });
            }
        }
        initSnake();

        function fireBall() {
            if (gameOver) return;
            const now = Date.now();
            let cooldown = 300 / fireSpeedLevel;
            if (now - player.lastShot < cooldown) return;
            player.lastShot = now;

            fireballs.push({
                x: player.x + player.width / 2 - 4,
                y: player.y,
                width: 8,
                height: 14,
                speed: 9,
                damage: weaponDmg
            });
            playSfx('fire');
        }

        function startMoveLeft() { player.moveDir = -1; }
        function startMoveRight() { player.moveDir = 1; }
        function stopMove() { player.moveDir = 0; }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') startMoveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') startMoveRight();
            if (e.key === ' ' || e.key === 'ArrowUp') fireBall();
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'a', 'ArrowRight', 'd'].includes(e.key)) stopMove();
        });

        function addFloatingText(text, x, y, color = '#ffe600') {
            floatingTexts.push({ text, x, y, life: 30, color });
        }

        function updateUI() {
            document.getElementById('goldVal').innerText = gold;
            document.getElementById('dmgVal').innerText = weaponDmg;
            document.getElementById('speedVal').innerText = fireSpeedLevel;
            document.getElementById('waveVal').innerText = wave;
            document.getElementById('dmgCost').innerText = dmgCost;
            document.getElementById('speedCost').innerText = speedCost;
        }

        // Shop Upgrades
        function buyDamageUpgrade() {
            if (gold >= dmgCost) {
                gold -= dmgCost;
                weaponDmg += 1;
                dmgCost = Math.floor(dmgCost * 1.5);
                playSfx('reward');
                updateUI();
            }
        }

        function buySpeedUpgrade() {
            if (gold >= speedCost) {
                gold -= speedCost;
                fireSpeedLevel += 0.3;
                speedCost = Math.floor(speedCost * 1.6);
                playSfx('reward');
                updateUI();
            }
        }

        // --- Main Game Update Loop ---
        function update() {
            if (gameOver) return;

            // Player Movement
            player.x += player.moveDir * player.speed;
            if (player.x < 5) player.x = 5;
            if (player.x > canvas.width - player.width - 5) player.x = canvas.width - player.width - 5;

            // Fireballs
            fireballs.forEach((fb, fIndex) => {
                fb.y -= fb.speed;
                if (fb.y < -20) fireballs.splice(fIndex, 1);
            });

            // Floating Texts
            floatingTexts.forEach((ft, index) => {
                ft.y -= 1;
                ft.life -= 1;
                if (ft.life <= 0) floatingTexts.splice(index, 1);
            });

            // Particles
            particles.forEach((p, pIndex) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 1;
                if (p.life <= 0) particles.splice(pIndex, 1);
            });

            // Snake Grid Movement
            moveTimer++;
            if (moveTimer >= moveInterval) {
                moveTimer = 0;

                if (snakeDirection === 'RIGHT') {
                    snakeHeadX += gridSize;
                    if (snakeHeadX >= canvas.width - gridSize - 10) {
                        snakeHeadY += gridSize + 6;
                        snakeDirection = 'LEFT';
                    }
                } else if (snakeDirection === 'LEFT') {
                    snakeHeadX -= gridSize;
                    if (snakeHeadX <= 10) {
                        snakeHeadY += gridSize + 6;
                        snakeDirection = 'RIGHT';
                    }
                }

                // Push new head & maintain body length
                let isMystery = (Math.random() < 0.15);
                let segmentHP = isMystery ? 20 : (5 + wave * 2);

                snakePath.unshift({
                    x: snakeHeadX,
                    y: snakeHeadY,
                    hp: segmentHP,
                    maxHp: segmentHP,
                    isMystery: isMystery
                });

                if (snakePath.length > totalBodySegments + 1) {
                    snakePath.pop();
                }

                if (snakeHeadY >= player.y - 25) {
                    gameOver = true;
                }
            }

            // Collisions: Fireballs vs Snake Brackets
            fireballs.forEach((fb, fIndex) => {
                snakePath.forEach((seg, sIndex) => {
                    if (
                        seg &&
                        fb.x < seg.x + gridSize &&
                        fb.x + fb.width > seg.x &&
                        fb.y < seg.y + gridSize &&
                        fb.y + fb.height > seg.y
                    ) {
                        seg.hp -= fb.damage;
                        playSfx('hit');
                        fireballs.splice(fIndex, 1);

                        // If bracket segment HP reaches 0, destroy it
                        if (seg.hp <= 0) {
                            addFloatingText('+5G', seg.x, seg.y, '#ffe600');
                            gold += 5;
                            score += 50;

                            // If it was a mystery box, grant random ultimate weapon boost!
                            if (seg.isMystery) {
                                let randomBonus = Math.floor(Math.random() * 15) + 1; // 1 to 15 damage boost
                                weaponDmg += randomBonus;
                                playSfx('reward');
                                addFloatingText('ULTIMATE WEAPON! +' + randomBonus + ' DMG', seg.x - 40, seg.y - 20, '#00f3ff');
                            }

                            snakePath.splice(sIndex, 1);
                            totalBodySegments = Math.max(0, totalBodySegments - 1);
                            updateUI();

                            // Wave Clear
                            if (totalBodySegments === 0) {
                                wave += 1;
                                moveInterval = Math.max(6, moveInterval - 2);
                                totalBodySegments = 18 + wave * 4;
                                initSnake();
                            }
                        }
                    }
                });
            });
        }

        // --- Render Graphics ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            // Draw Hero
            ctx.fillStyle = '#00f3ff';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 6, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(player.x + player.width / 2 - 4, player.y + 12, 8, 14);
            ctx.fillStyle = '#ff7700';
            ctx.fillRect(player.x + 2, player.y + 14, 6, 10);
            ctx.fillRect(player.x + player.width - 8, player.y + 14, 6, 10);

            // Fireballs
            fireballs.forEach(fb => {
                ctx.fillStyle = fb.damage > 5 ? '#00f3ff' : '#ff2a5f';
                ctx.shadowBlur = 12;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(fb.x, fb.y, fb.width, fb.height);
                ctx.shadowBlur = 0;
            });

            // Floating Numbers & Text
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 14px Impact';
                ctx.fillText(ft.text, ft.x, ft.y);
            });

            // Draw Snake Segments ([ ] Brackets with HP)
            snakePath.forEach((seg, index) => {
                if (!seg) return;
                const isHead = (index === 0);

                if (isHead) {
                    ctx.fillStyle = '#ff2a5f';
                    ctx.fillRect(seg.x - 2, seg.y - 2, gridSize + 4, gridSize + 4);
                } else {
                    ctx.strokeStyle = seg.isMystery ? '#ffe600' : '#00f3ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(seg.x, seg.y, gridSize, gridSize);

                    ctx.fillStyle = seg.isMystery ? '#ffe600' : '#ff7700';
                    ctx.font = '11px Impact';
                    ctx.fillText(seg.isMystery ? '[?]' : '[' + seg.hp + ']', seg.x + 1, seg.y + 15);
                }
            });

            // Game Over Screen
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff2a5f';
                ctx.font = '32px Impact';
                ctx.fillText('GAME OVER', canvas.width / 2 - 75, canvas.height / 2 - 10);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Impact';
                ctx.fillText('Click to Restart', canvas.width / 2 - 55, canvas.height / 2 + 30);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        window.addEventListener('click', () => {
            if (gameOver) {
                score = 0;
                wave = 1;
                gold = 0;
                weaponDmg = 1;
                fireSpeedLevel = 1;
                moveInterval = 14;
                totalBodySegments = 20;
                gameOver = false;
                initSnake();
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
</html>
