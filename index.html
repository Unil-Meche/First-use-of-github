<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ARCADE • Epic Cyber Raid</title>
    <style>
        :root {
            --neon-red: #ff2a5f;
            --neon-orange: #ff7700;
            --neon-yellow: #ffe600;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --dark-bg: #050508;
            --panel-bg: rgba(20, 20, 30, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', Charcoal, sans-serif;
            letter-spacing: 1px;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1a082f 0%, var(--dark-bg) 75%);
        }

        /* Lightning Canvas Background */
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3.8rem;
            text-transform: uppercase;
            font-style: italic;
            background: linear-gradient(180deg, #fff 20%, var(--neon-cyan) 60%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            margin-bottom: 0.2rem;
        }

        .subtitle {
            color: var(--neon-yellow);
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.4);
        }

        /* Rock Sound Deck */
        .sound-deck {
            background: var(--panel-bg);
            border: 2px solid var(--neon-purple);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 25px rgba(176, 0, 255, 0.3);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 550px;
        }

        .deck-title {
            color: var(--neon-cyan);
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .rock-btn {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-red));
            border: none;
            color: white;
            font-size: 1.2rem;
            font-family: 'Impact', sans-serif;
            text-transform: uppercase;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(176, 0, 255, 0.6);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .rock-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        /* Equalizer Bars */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 25px;
        }

        .eq-bar {
            width: 6px;
            height: 5px;
            background: var(--neon-cyan);
            border-radius: 3px;
        }

        .eq-bar.active {
            animation: rockEq 0.25s infinite alternate ease-in-out;
        }

        .eq-bar:nth-child(1) { animation-delay: 0.05s; }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { animation-delay: 0.1s; }
        .eq-bar:nth-child(4) { animation-delay: 0.25s; }
        .eq-bar:nth-child(5) { animation-delay: 0.15s; }

        @keyframes rockEq {
            0% { height: 5px; background: var(--neon-cyan); }
            100% { height: 30px; background: var(--neon-yellow); box-shadow: 0 0 15px var(--neon-yellow); }
        }

        /* RPG Boss Raid Arena */
        .boss-arena {
            background: linear-gradient(180deg, rgba(20, 10, 35, 0.9), rgba(5, 5, 12, 0.95));
            border: 3px solid var(--neon-red);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.4);
            margin-bottom: 2rem;
            position: relative;
        }

        .boss-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: var(--neon-yellow);
        }

        /* Health Bar Container */
        .hp-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            border-radius: 10px;
            height: 28px;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-orange), var(--neon-red));
            width: 100%;
            transition: width 0.1s ease-out;
        }

        .hp-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        .boss-target {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, var(--neon-red), #3a0015);
            border: 4px solid var(--neon-yellow);
            border-radius: 50%;
            margin: 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            cursor: pointer;
            box-shadow: 0 0 35px var(--neon-red);
            transition: transform 0.05s ease;
        }

        .boss-target:active {
            transform: scale(0.85) rotate(-10deg);
        }

        /* Floating Damage Text */
        .damage-pop {
            position: absolute;
            color: var(--neon-yellow);
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.4);
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .stats-grid span {
            color: var(--neon-cyan);
        }

        /* Upgrades Store Panel */
        .store-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
        }

        .store-title {
            color: var(--neon-cyan);
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .store-btns {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .upgrade-btn {
            background: linear-gradient(135deg, #005f73, var(--neon-cyan));
            border: none;
            color: #000;
            font-family: 'Impact', sans-serif;
            font-size: 1rem;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .upgrade-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .upgrade-btn:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        footer {
            margin-top: 2rem;
            color: #64748B;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <canvas id="fxCanvas"></canvas>

    <div class="container">
        <h1>NEXUS ARCADE</h1>
        <p class="subtitle">⚡ Epic Cyber Boss Raid & Rock Dimension ⚡</p>

        <!-- Rock Beat Synthesizer Deck -->
        <div class="sound-deck">
            <div class="deck-title">🎸 Heavy Metal Synth Soundtrack</div>
            <button id="rockBtn" class="rock-btn" onclick="toggleRockBeat()">Play Rock Beat 🎸</button>
            <div class="equalizer">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
        </div>

        <!-- RPG Boss Battle Arena -->
        <div class="boss-arena" id="arenaBox">
            <div class="boss-header">
                <span id="bossName">DRAGON CORE v1</span>
                <span>LEVEL <span id="bossLevel">1</span></span>
            </div>

            <div class="hp-container">
                <div id="hpFill" class="hp-fill"></div>
                <div id="hpText" class="hp-text">100 / 100 HP</div>
            </div>

            <div id="bossCore" class="boss-target" onclick="attackBoss(event)">🐲</div>
            <p style="color:#cbd5e1; font-family:'Segoe UI',sans-serif; font-size:0.9rem;">Tap rapidly to smash the boss and earn Gold & XP!</p>

            <div class="stats-grid">
                <div>GOLD: <span id="goldVal">0</span> G</div>
                <div>CLICK DMG: <span id="dmgVal">1</span></div>
                <div>AUTO DPS: <span id="dpsVal">0</span>/s</div>
            </div>
        </div>

        <!-- Upgrades Store -->
        <div class="store-panel">
            <div class="store-title">🛒 Arsenal & Upgrades Store</div>
            <div class="store-btns">
                <button class="upgrade-btn" id="upgDmgBtn" onclick="buyDamageUpgrade()">Sharpen Blade (+1 Dmg) [Cost: <span id="dmgCost">15</span>G]</button>
                <button class="upgrade-btn" id="upgAutoBtn" onclick="buyAutoClicker()">Laser Droid (+1 DPS) [Cost: <span id="autoCost">50</span>G]</button>
            </div>
        </div>

        <footer>
            NEXUS ARCADE • Infinite Action & Progression Engine
        </footer>
    </div>

    <script>
        // --- 1. Lightning Sparks Particle Engine ---
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        let sparks = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Spark {
            constructor(x, y) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * -3 - 1;
                this.life = Math.random() * 60 + 40;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#ff7700';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initSparks() {
            sparks = [];
            for (let i = 0; i < 35; i++) sparks.push(new Spark());
        }
        initSparks();

        function animateSparks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sparks.forEach((s, index) => {
                s.update();
                s.draw();
                if (s.life <= 0) sparks[index] = new Spark();
            });
            requestAnimationFrame(animateSparks);
        }
        animateSparks();

        window.addEventListener('click', (e) => {
            for (let i = 0; i < 4; i++) {
                sparks.push(new Spark(e.clientX, e.clientY));
            }
        });

        // --- 2. Web Audio Rock Synthesizer Engine ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isPlaying = false;
        let beatTimer = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        const rockScale = [110.00, 130.81, 146.83, 164.81, 196.00, 220.00, 246.94, 293.66];

        function playRockBeatNote() {
            if (!isPlaying) return;
            initAudio();

            const freq = rockScale[Math.floor(Math.random() * rockScale.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);

            beatTimer = setTimeout(playRockBeatNote, 220);
        }

        function toggleRockBeat() {
            initAudio();
            const btn = document.getElementById('rockBtn');
            const eqBars = document.querySelectorAll('.eq-bar');

            if (isPlaying) {
                isPlaying = false;
                clearTimeout(beatTimer);
                btn.innerText = "Play Rock Beat 🎸";
                eqBars.forEach(b => b.classList.remove('active'));
            } else {
                isPlaying = true;
                btn.innerText = "Stop Rock Beat ⏹";
                eqBars.forEach(b => b.classList.add('active'));
                playRockBeatNote();
            }
        }

        function playHitSound(pitch) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(300 + (pitch * 60), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // --- 3. RPG Game Progression & Boss Mechanics ---
        let player = {
            gold: 0,
            damage: 1,
            dps: 0,
            dmgCost: 15,
            autoCost: 50
        };

        let boss = {
            level: 1,
            maxHp: 100,
            hp: 100,
            name: "CYBER DRAGON"
        };

        const bossNames = ["CYBER DRAGON", "NEON TITAN", "QUANTUM MECH", "VOID OVERLORD", "GIGA SPECTRE"];

        function updateUI() {
            document.getElementById('goldVal').innerText = player.gold;
            document.getElementById('dmgVal').innerText = player.damage;
            document.getElementById('dpsVal').innerText = player.dps;
            document.getElementById('dmgCost').innerText = player.dmgCost;
            document.getElementById('autoCost').innerText = player.autoCost;

            document.getElementById('bossLevel').innerText = boss.level;
            document.getElementById('bossName').innerText = boss.name;
            
            const hpPercent = Math.max(0, (boss.hp / boss.maxHp) * 100);
            document.getElementById('hpFill').style.width = hpPercent + '%';
            document.getElementById('hpText').innerText = Math.ceil(boss.hp) + ' / ' + boss.maxHp + ' HP';

            // Store button states
            document.getElementById('upgDmgBtn').disabled = player.gold < player.dmgCost;
            document.getElementById('upgAutoBtn').disabled = player.gold < player.autoCost;
        }

        function attackBoss(e) {
            damageBoss(player.damage, e.clientX, e.clientY);
            playHitSound(player.damage % 8);
        }

        function damageBoss(amt, clientX, clientY) {
            boss.hp -= amt;
            showFloatingText(amt, clientX, clientY);

            if (boss.hp <= 0) {
                // Boss Defeated Reward
                const reward = boss.level * 10;
                player.gold += reward;
                
                // Scale up next boss
                boss.level += 1;
                boss.maxHp = Math.floor(100 * Math.pow(1.35, boss.level - 1));
                boss.hp = boss.maxHp;
                boss.name = bossNames[(boss.level - 1) % bossNames.length];
            }
            updateUI();
        }

        function showFloatingText(amt, x, y) {
            const arena = document.getElementById('arenaBox');
            const pop = document.createElement('div');
            pop.className = 'damage-pop';
            pop.innerText = '-' + amt;
            
            if (!x || !y) {
                const rect = document.getElementById('bossCore').getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            }

            pop.style.left = (x - 20) + 'px';
            pop.style.top = (y - 40) + 'px';
            arena.appendChild(pop);

            setTimeout(() => pop.remove(), 600);
        }

        function buyDamageUpgrade() {
            if (player.gold >= player.dmgCost) {
                player.gold -= player.dmgCost;
                player.damage += 1;
                player.dmgCost = Math.floor(player.dmgCost * 1.4);
                playHitSound(10);
                updateUI();
            }
        }

        function buyAutoClicker() {
            if (player.gold >= player.autoCost) {
                player.gold -= player.autoCost;
                player.dps += 1;
                player.autoCost = Math.floor(player.autoCost * 1.5);
                playHitSound(12);
                updateUI();
            }
        }

        // Auto-Clicker (DPS) Loop every second
        setInterval(() => {
            if (player.dps > 0) {
                damageBoss(player.dps);
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
