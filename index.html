<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ARCADE • Dynamic HP Snake Blaster</title>
    <style>
        :root {
            --neon-red: #ff2a5f;
            --neon-orange: #ff7700;
            --neon-yellow: #ffe600;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --neon-pink: #ff007f;
            --neon-green: #10B981;
            --dark-bg: #050508;
            --panel-bg: rgba(20, 20, 30, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', Charcoal, sans-serif;
            letter-spacing: 1px;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1a082f 0%, var(--dark-bg) 75%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            text-transform: uppercase;
            font-style: italic;
            background: linear-gradient(180deg, #fff 20%, var(--neon-cyan) 60%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            margin-bottom: 0.1rem;
        }

        .subtitle {
            color: var(--neon-yellow);
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.4);
        }

        /* Top HUD Stats & Shop */
        .hud-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            font-size: 1.1rem;
        }

        .hud-panel span {
            color: var(--neon-yellow);
        }

        /* Upgrades Store Bar */
        .store-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .store-btn {
            background: linear-gradient(135deg, #005f73, var(--neon-cyan));
            border: none;
            color: #000;
            font-family: 'Impact', sans-serif;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: transform 0.1s;
        }

        .store-btn:hover {
            transform: scale(1.05);
        }

        /* Game Arena Canvas Container */
        .game-wrapper {
            background: rgba(10, 10, 20, 0.95);
            border: 3px solid var(--neon-purple);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(176, 0, 255, 0.3);
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #gameCanvas {
            background: #080812;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 100%;
            touch-action: none;
        }

        /* Arcade Touch Controls */
        .control-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-top: 10px;
            gap: 15px;
        }

        .ctrl-btn {
            background: linear-gradient(135deg, #005f73, var(--neon-cyan));
            border: none;
            color: #000;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        footer {
            margin-top: 1.5rem;
            color: #64748B;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEXUS ARCADE</h1>
        <p class="subtitle">⚡ Dynamic HP Ramp • 5-Minute Survival RPG ⚡</p>

        <!-- HUD & Currency Panel -->
        <div class="hud-panel">
            <div>TIME: <span id="timeVal">05:00</span></div>
            <div>GOLD: <span id="goldVal">0</span> G</div>
            <div>DMG: <span id="dmgVal">1</span></div>
            <div>FIRE DELAY: <span id="fireDelayVal">300</span>ms</div>
        </div>

        <!-- Upgrades Shop -->
        <div class="store-bar">
            <button class="store-btn" onclick="buyDamageUpgrade()">+1 Damage [Cost: <span id="dmgCost">20</span>G]</button>
            <button class="store-btn" onclick="buyFireRateUpgrade()">Fast Fire (-25ms) [Cost: <span id="rateCost">25</span>G]</button>
            <button class="store-btn" style="background: linear-gradient(135deg, var(--neon-purple), var(--neon-red)); color:#fff;" onclick="toggleRockBeat()">🎵 Music</button>
        </div>

        <!-- Real-time Canvas Game -->
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="460" height="480"></canvas>

            <!-- Touch Controls for Mobile -->
            <div class="control-panel">
                <button class="ctrl-btn" onpointerdown="startMoveLeft()" onpointerup="stopMove()" onpointerleave="stopMove()">◄ LEFT</button>
                <button class="ctrl-btn" onpointerdown="startMoveRight()" onpointerup="stopMove()" onpointerleave="stopMove()">RIGHT ►</button>
            </div>
        </div>

        <footer>
            NEXUS ARCADE • Dynamic HP: 3 HP ➔ 5 HP ➔ 7 HP ➔ 9 HP Progression!
        </footer>
    </div>

    <script>
        // --- Web Audio Synthesizer Engine ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isMusicPlaying = false;
        let beatTimer = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        const rockScale = [110.00, 130.81, 146.83, 164.81, 196.00, 220.00];

        function playBeat() {
            if (!isMusicPlaying) return;
            initAudio();
            const freq = rockScale[Math.floor(Math.random() * rockScale.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);

            beatTimer = setTimeout(playBeat, 220);
        }

        function toggleRockBeat() {
            initAudio();
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) playBeat();
            else clearTimeout(beatTimer);
        }

        function playSfx(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'fire') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            } else if (type === 'reward' || type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // --- Game Variables & RPG Economy ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let gold = 0;
        let weaponDmg = 1;
        let fireDelay = 300; // ms cooldown
        let hasLaserDrone = false;
        let gameOver = false;
        let gameWon = false;

        let dmgCost = 20;
        let rateCost = 25;

        // 5-Minute Timer (300 Seconds)
        let timeRemaining = 300; 
        let timerInterval = null;
        let totalSpawnedSegments = 0;

        // Player (Hero)
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 40,
            width: 30,
            height: 30,
            speed: 6,
            moveDir: 0,
            lastShot: 0
        };

        let fireballs = [];
        let particles = [];
        let floatingTexts = [];
        let laserBeams = [];

        // Snake Setup
        let snakePath = [];
        const gridSize = 22;
        let snakeHeadX = 40;
        let snakeHeadY = 20;
        let snakeDirection = 'RIGHT';
        
        let moveTimer = 0;
        let moveInterval = 56; // Ultra-slow 25% slither speed

        // Calculates HP based on segment tier (3 HP ➔ 5 HP ➔ 7 HP ➔ 9 HP...)
        function calculateSegmentHP(index) {
            if (index < 10) return 3;
            if (index < 20) return 5;
            if (index < 30) return 7;
            if (index < 40) return 9;
            return 12;
        }

        function initSnake() {
            snakePath = [];
            snakeHeadX = 40;
            snakeHeadY = 20;
            snakeDirection = 'RIGHT';
            totalSpawnedSegments = 0;

            for (let i = 0; i < 20; i++) {
                totalSpawnedSegments++;
                let isMystery = (Math.random() < 0.18 && i > 3);
                let segmentHP = isMystery ? 20 : calculateSegmentHP(i);

                snakePath.push({
                    x: snakeHeadX - (i * gridSize),
                    y: snakeHeadY,
                    hp: segmentHP,
                    maxHp: segmentHP,
                    isMystery: isMystery
                });
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameOver && !gameWon) {
                    timeRemaining--;
                    if (timeRemaining <= 0) timeRemaining = 0;
                    updateUI();
                }
            }, 1000);
        }

        initSnake();
        startTimer();

        // Auto-Firing System
        function autoFire() {
            if (gameOver || gameWon) return;
            const now = Date.now();
            if (now - player.lastShot >= fireDelay) {
                player.lastShot = now;
                fireballs.push({
                    x: player.x + player.width / 2 - 4,
                    y: player.y,
                    width: 8,
                    height: 14,
                    speed: 10,
                    damage: weaponDmg
                });
                playSfx('fire');

                if (hasLaserDrone) {
                    laserBeams.push({
                        x1: player.x + player.width / 2,
                        y1: player.y,
                        x2: player.x + player.width / 2 + (Math.random() * 40 - 20),
                        y2: 0,
                        life: 4
                    });

                    if (snakePath.length > 0) {
                        let target = snakePath[Math.floor(Math.random() * snakePath.length)];
                        if (target) {
                            target.hp -= weaponDmg;
                            if (target.hp <= 0) handleSegmentDestroy(target);
                        }
                    }
                }
            }
        }

        function startMoveLeft() { player.moveDir = -1; }
        function startMoveRight() { player.moveDir = 1; }
        function stopMove() { player.moveDir = 0; }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') startMoveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') startMoveRight();
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'a', 'ArrowRight', 'd'].includes(e.key)) stopMove();
        });

        function addFloatingText(text, x, y, color = '#ffe600') {
            floatingTexts.push({ text, x, y, life: 30, color });
        }

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateUI() {
            document.getElementById('timeVal').innerText = formatTime(timeRemaining);
            document.getElementById('goldVal').innerText = gold;
            document.getElementById('dmgVal').innerText = weaponDmg;
            document.getElementById('fireDelayVal').innerText = fireDelay;
            document.getElementById('dmgCost').innerText = dmgCost;
            document.getElementById('rateCost').innerText = rateCost;
        }

        function buyDamageUpgrade() {
            if (gold >= dmgCost) {
                gold -= dmgCost;
                weaponDmg += 1;
                dmgCost = Math.floor(dmgCost * 1.5);
                playSfx('reward');
                updateUI();
            }
        }

        function buyFireRateUpgrade() {
            if (gold >= rateCost && fireDelay > 80) {
                gold -= rateCost;
                fireDelay = Math.max(80, fireDelay - 25);
                rateCost = Math.floor(rateCost * 1.6);
                playSfx('reward');
                updateUI();
            }
        }

        function handleSegmentDestroy(seg) {
            let rewardGold = seg.maxHp;
            addFloatingText('+' + rewardGold + 'G', seg.x, seg.y, '#ffe600');
            gold += rewardGold;
            score += rewardGold * 10;

            if (seg.isMystery) {
                hasLaserDrone = true;
                playSfx('reward');
                addFloatingText('⚡ AUTO LASER DRONE UNLOCKED!', seg.x - 60, seg.y - 20, '#00f3ff');
            }

            let index = snakePath.indexOf(seg);
            if (index !== -1) snakePath.splice(index, 1);
            updateUI();

            if (snakePath.length === 0) {
                gameWon = true;
                playSfx('win');
            }
        }

        // --- Main Game Update Loop ---
        function update() {
            if (gameOver || gameWon) return;

            autoFire();

            // Player Movement
            player.x += player.moveDir * player.speed;
            if (player.x < 5) player.x = 5;
            if (player.x > canvas.width - player.width - 5) player.x = canvas.width - player.width - 5;

            // Fireballs
            fireballs.forEach((fb, fIndex) => {
                fb.y -= fb.speed;
                if (fb.y < -20) fireballs.splice(fIndex, 1);
            });

            // Laser Beams
            laserBeams.forEach((lb, lbIndex) => {
                lb.life -= 1;
                if (lb.life <= 0) laserBeams.splice(lbIndex, 1);
            });

            // Floating Texts
            floatingTexts.forEach((ft, index) => {
                ft.y -= 1;
                ft.life -= 1;
                if (ft.life <= 0) floatingTexts.splice(index, 1);
            });

            // Particles
            particles.forEach((p, pIndex) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 1;
                if (p.life <= 0) particles.splice(pIndex, 1);
            });

            // Snake Grid Movement
            moveTimer++;
            if (moveTimer >= moveInterval) {
                moveTimer = 0;

                if (snakeDirection === 'RIGHT') {
                    snakeHeadX += gridSize;
                    if (snakeHeadX >= canvas.width - gridSize - 10) {
                        snakeHeadY += gridSize + 6;
                        snakeDirection = 'LEFT';
                    }
                } else if (snakeDirection === 'LEFT') {
                    snakeHeadX -= gridSize;
                    if (snakeHeadX <= 10) {
                        snakeHeadY += gridSize + 6;
                        snakeDirection = 'RIGHT';
                    }
                }

                if (timeRemaining > 0) {
                    totalSpawnedSegments++;
                    let isMystery = (Math.random() < 0.16);
                    let segmentHP = isMystery ? 20 : calculateSegmentHP(totalSpawnedSegments);

                    snakePath.unshift({
                        x: snakeHeadX,
                        y: snakeHeadY,
                        hp: segmentHP,
                        maxHp: segmentHP,
                        isMystery: isMystery
                    });
                } else {
                    if (snakePath.length > 0) {
                        snakePath.unshift({
                            x: snakeHeadX,
                            y: snakeHeadY,
                            hp: 5,
                            maxHp: 5,
                            isMystery: false
                        });
                        snakePath.pop();
                    }
                }

                if (snakeHeadY >= player.y - 25) {
                    gameOver = true;
                }
            }

            // Collisions
            fireballs.forEach((fb, fIndex) => {
                snakePath.forEach((seg, sIndex) => {
                    if (
                        seg &&
                        fb.x < seg.x + gridSize &&
                        fb.x + fb.width > seg.x &&
                        fb.y < seg.y + gridSize &&
                        fb.y + fb.height > seg.y
                    ) {
                        seg.hp -= fb.damage;
                        playSfx('hit');
                        fireballs.splice(fIndex, 1);

                        if (seg.hp <= 0) {
                            handleSegmentDestroy(seg);
                        }
                    }
                });
            });
        }

        // --- Render Graphics ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            // Draw Hero & Auto Drone
            ctx.fillStyle = '#00f3ff';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 6, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(player.x + player.width / 2 - 4, player.y + 12, 8, 14);
            ctx.fillStyle = '#ff7700';
            ctx.fillRect(player.x + 2, player.y + 14, 6, 10);
            ctx.fillRect(player.x + player.width - 8, player.y + 14, 6, 10);

            if (hasLaserDrone) {
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(player.x + player.width / 2 - 6, player.y - 14, 12, 8);
            }

            // Laser Beams
            laserBeams.forEach(lb => {
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(lb.x1, lb.y1);
                ctx.lineTo(lb.x2, lb.y2);
                ctx.stroke();
            });

            // Fireballs
            fireballs.forEach(fb => {
                ctx.fillStyle = '#ff2a5f';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff2a5f';
                ctx.fillRect(fb.x, fb.y, fb.width, fb.height);
                ctx.shadowBlur = 0;
            });

            // Floating Texts
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 14px Impact';
                ctx.fillText(ft.text, ft.x, ft.y);
            });

            // Draw Snake Head & Alternating Brackets
            snakePath.forEach((seg, index) => {
                if (!seg) return;
                const isHead = (index === 0);

                if (isHead) {
                    ctx.fillStyle = '#10B981';
                    ctx.beginPath();
                    ctx.moveTo(seg.x + gridSize / 2, seg.y - 4);
                    ctx.lineTo(seg.x + gridSize + 4, seg.y + gridSize + 4);
                    ctx.lineTo(seg.x - 4, seg.y + gridSize + 4);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#ffe600';
                    ctx.fillRect(seg.x + 3, seg.y + 6, 4, 4);
                    ctx.fillRect(seg.x + 13, seg.y + 6, 4, 4);
                } else {
                    let isEven = (index % 2 === 0);
                    ctx.fillStyle = seg.isMystery ? '#ff007f' : (isEven ? '#ffe600' : '#111115');
                    ctx.strokeStyle = seg.isMystery ? '#ffe600' : (isEven ? '#ff7700' : '#00f3ff');
                    ctx.lineWidth = 2;

                    ctx.fillRect(seg.x, seg.y, gridSize, gridSize);
                    ctx.strokeRect(seg.x, seg.y, gridSize, gridSize);

                    ctx.fillStyle = seg.isMystery ? '#fff' : (isEven ? '#000' : '#00f3ff');
                    ctx.font = 'bold 11px Impact';
                    let label = seg.isMystery ? '[?]' : '[' + seg.hp + ']';
                    ctx.fillText(label, seg.x + 2, seg.y + 15);
                }
            });

            // Victory Screen
            if (gameWon) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#10B981';
                ctx.font = '36px Impact';
                ctx.fillText('VICTORY! SNAKE DESTROYED!', canvas.width / 2 - 170, canvas.height / 2 - 10);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Impact';
                ctx.fillText('Click to Play Again', canvas.width / 2 - 60, canvas.height / 2 + 30);
            }

            // Game Over Screen
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff2a5f';
                ctx.font = '32px Impact';
                ctx.fillText('GAME OVER', canvas.width / 2 - 75, canvas.height / 2 - 10);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Impact';
                ctx.fillText('Click to Restart', canvas.width / 2 - 55, canvas.height / 2 + 30);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        window.addEventListener('click', () => {
            if (gameOver || gameWon) {
                score = 0;
                gold = 0;
                weaponDmg = 1;
                fireDelay = 300;
                hasLaserDrone = false;
                timeRemaining = 300;
                gameOver = false;
                gameWon = false;
                initSnake();
                startTimer();
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
</html>
