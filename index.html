<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>
<style>
  :root {
    --light-sq: #f0d9b5;
    --dark-sq: #b58863;
    --selected: rgba(20, 85, 30, 0.5);
    --last-move: rgba(155, 199, 0, 0.41);
    --check: rgba(235, 30, 30, 0.65);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1e1e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .controls {
    margin-bottom: 15px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button, select {
    padding: 8px 14px;
    font-size: 14px;
    border: none;
    border-radius: 5px;
    background: #333;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #444; }
  #status {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    min-height: 24px;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 65px);
    grid-template-rows: repeat(8, 65px);
    border: 4px solid #333;
    user-select: none;
    position: relative;
  }
  .square {
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    cursor: pointer;
    position: relative;
  }
  .light { background-color: var(--light-sq); }
  .dark { background-color: var(--dark-sq); }
  .square.selected::after,
  .square.last-move::after,
  .square.in-check::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .square.selected::after { background: var(--selected); }
  .square.last-move::after { background: var(--last-move); }
  .square.in-check::after { background: var(--check); }
  .hint-dot {
    width: 20px;
    height: 20px;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }
  .hint-capture {
    position: absolute;
    inset: 4px;
    border: 5px solid rgba(0, 0, 0, 0.25);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }
  .piece {
    z-index: 1;
    line-height: 1;
  }
  .white-piece {
    color: #fff;
    text-shadow: 0 1px 2px #000, 0 0 2px #000;
  }
  .black-piece {
    color: #111;
    text-shadow: 0 1px 1px rgba(255,255,255,0.3);
  }
  #promo-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .promo-box {
    background: #2b2b2b;
    padding: 20px;
    border-radius: 8px;
    display: flex;
    gap: 15px;
    font-size: 48px;
  }
  .promo-choice {
    cursor: pointer;
    padding: 10px;
    border-radius: 6px;
    background: #3d3d3d;
  }
  .promo-choice:hover { background: #555; }
</style>
</head>
<body>

<div class="controls">
  <select id="mode">
    <option value="ai">1 Player (vs AI)</option>
    <option value="pvp">2 Players (Local)</option>
  </select>
  <button onclick="initGame()">New Game</button>
</div>

<div id="status">White's Turn</div>
<div id="board"></div>

<div id="promo-modal">
  <div class="promo-box" id="promo-choices"></div>
</div>

<script>
const PIECES = {
  w: { K: '♔', Q: '♕', R: '♖', B: '♗', N: '♘', P: '♙' },
  b: { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' }
};

const PIECE_VALUES = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

let board = [];
let turn = 'w';
let selected = null;
let legalMoves = [];
let castling = { wK: true, wQ: true, bK: true, bQ: true };
let epTarget = null;
let lastMove = null;
let gameOver = false;

function initGame() {
  const setup = [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR']
  ];
  board = setup.map(r => [...r]);
  turn = 'w';
  selected = null;
  legalMoves = [];
  castling = { wK: true, wQ: true, bK: true, bQ: true };
  epTarget = null;
  lastMove = null;
  gameOver = false;
  updateStatus();
  render();
}

function inBounds(r, c) {
  return r >= 0 && r < 8 && c >= 0 && c < 8;
}

function getPseudoMoves(b, r, c, castlingRights, ep) {
  const piece = b[r][c];
  if (!piece) return [];
  const color = piece[0];
  const type = piece[1];
  const enemy = color === 'w' ? 'b' : 'w';
  const moves = [];

  const addMove = (tr, tc, extra = {}) => {
    moves.push({ fr: r, fc: c, tr, tc, ...extra });
  };

  if (type === 'P') {
    const dir = color === 'w' ? -1 : 1;
    const startRow = color === 'w' ? 6 : 1;
    const promoRow = color === 'w' ? 0 : 7;

    if (inBounds(r + dir, c) && !b[r + dir][c]) {
      addMove(r + dir, c, { promo: r + dir === promoRow });
      if (r === startRow && !b[r + 2 * dir][c]) {
        addMove(r + 2 * dir, c, { doublePawn: true });
      }
    }
    for (const dc of [-1, 1]) {
      const nr = r + dir, nc = c + dc;
      if (!inBounds(nr, nc)) continue;
      if (b[nr][nc] && b[nr][nc][0] === enemy) {
        addMove(nr, nc, { promo: nr === promoRow });
      } else if (ep && ep.r === nr && ep.c === nc) {
        addMove(nr, nc, { enPassant: true });
      }
    }
  } else if (type === 'N') {
    const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for (const [dr, dc] of jumps) {
      const nr = r + dr, nc = c + dc;
      if (inBounds(nr, nc) && (!b[nr][nc] || b[nr][nc][0] === enemy)) {
        addMove(nr, nc);
      }
    }
  } else if (type === 'B' || type === 'R' || type === 'Q') {
    const dirs = [];
    if (type === 'B' || type === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if (type === 'R' || type === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    for (const [dr, dc] of dirs) {
      let nr = r + dr, nc = c + dc;
      while (inBounds(nr, nc)) {
        if (!b[nr][nc]) {
          addMove(nr, nc);
        } else {
          if (b[nr][nc][0] === enemy) addMove(nr, nc);
          break;
        }
        nr += dr;
        nc += dc;
      }
    }
  } else if (type === 'K') {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && (!b[nr][nc] || b[nr][nc][0] === enemy)) {
          addMove(nr, nc);
        }
      }
    }
    // Castling
    const row = color === 'w' ? 7 : 0;
    if (r === row && c === 4) {
      if (castlingRights[color + 'K'] && !b[row][5] && !b[row][6] && b[row][7] === color + 'R') {
        addMove(row, 6, { castle: 'K' });
      }
      if (castlingRights[color + 'Q'] && !b[row][3] && !b[row][2] && !b[row][1] && b[row][0] === color + 'R') {
        addMove(row, 2, { castle: 'Q' });
      }
    }
  }
  return moves;
}

function isSquareAttacked(b, targetR, targetC, attackerColor) {
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (b[r][c] && b[r][c][0] === attackerColor) {
        const moves = getPseudoMoves(b, r, c, { wK:false, wQ:false, bK:false, bQ:false }, null);
        if (moves.some(m => m.tr === targetR && m.tc === targetC)) return true;
      }
    }
  }
  return false;
}

function isInCheck(b, color) {
  const enemy = color === 'w' ? 'b' : 'w';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (b[r][c] === color + 'K') {
        return isSquareAttacked(b, r, c, enemy);
      }
    }
  }
  return false;
}

function applyMoveToState(b, move, castlingRights, promoPiece = 'Q') {
  const nextB = b.map(r => [...r]);
  const nextCastling = { ...castlingRights };
  const piece = nextB[move.fr][move.fc];
  const color = piece[0];
  const enemy = color === 'w' ? 'b' : 'w';

  nextB[move.tr][move.tc] = move.promo ? color + promoPiece : piece;
  nextB[move.fr][move.fc] = null;

  if (move.enPassant) {
    nextB[move.fr][move.tc] = null;
  }
  if (move.castle === 'K') {
    nextB[move.tr][5] = nextB[move.tr][7];
    nextB[move.tr][7] = null;
  } else if (move.castle === 'Q') {
    nextB[move.tr][3] = nextB[move.tr][0];
    nextB[move.tr][0] = null;
  }

  // Update castling rights
  if (piece === 'wK') { nextCastling.wK = false; nextCastling.wQ = false; }
  if (piece === 'bK') { nextCastling.bK = false; nextCastling.bQ = false; }
  if (move.fr === 7 && move.fc === 0 || move.tr === 7 && move.tc === 0) nextCastling.wQ = false;
  if (move.fr === 7 && move.fc === 7 || move.tr === 7 && move.tc === 7) nextCastling.wK = false;
  if (move.fr === 0 && move.fc === 0 || move.tr === 0 && move.tc === 0) nextCastling.bQ = false;
  if (move.fr === 0 && move.fc === 7 || move.tr === 0 && move.tc === 7) nextCastling.bK = false;

  const nextEp = move.doublePawn ? { r: (move.fr + move.tr) / 2, c: move.fc } : null;
  return { board: nextB, castling: nextCastling, ep: nextEp };
}

function getLegalMoves(b, color, castlingRights, ep) {
  const legal = [];
  const enemy = color === 'w' ? 'b' : 'w';

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (b[r][c] && b[r][c][0] === color) {
        const pseudo = getPseudoMoves(b, r, c, castlingRights, ep);
        for (const m of pseudo) {
          if (m.castle) {
            if (isInCheck(b, color)) continue;
            const stepCol = m.castle === 'K' ? 5 : 3;
            if (isSquareAttacked(b, r, stepCol, enemy)) continue;
          }
          const { board: nextB } = applyMoveToState(b, m, castlingRights);
          if (!isInCheck(nextB, color)) {
            legal.push(m);
          }
        }
      }
    }
  }
  return legal;
}

function handleSquareClick(r, c) {
  if (gameOver) return;
  const isAI = document.getElementById('mode').value === 'ai';
  if (isAI && turn === 'b') return;

  const move = legalMoves.find(m => m.tr === r && m.tc === c);
  if (move) {
    if (move.promo) {
      promptPromotion(move);
    } else {
      executeMove(move);
    }
    return;
  }

  if (board[r][c] && board[r][c][0] === turn) {
    selected = { r, c };
    legalMoves = getLegalMoves(board, turn, castling, epTarget).filter(m => m.fr === r && m.fc === c);
  } else {
    selected = null;
    legalMoves = [];
  }
  render();
}

function promptPromotion(move) {
  const modal = document.getElementById('promo-modal');
  const choices = document.getElementById('promo-choices');
  choices.innerHTML = '';
  ['Q', 'R', 'B', 'N'].forEach(type => {
    const div = document.createElement('div');
    div.className = 'promo-choice ' + (turn === 'w' ? 'white-piece' : 'black-piece');
    div.textContent = PIECES[turn][type];
    div.onclick = () => {
      modal.style.display = 'none';
      executeMove(move, type);
    };
    choices.appendChild(div);
  });
  modal.style.display = 'flex';
}

function executeMove(move, promoPiece = 'Q') {
  const res = applyMoveToState(board, move, castling, promoPiece);
  board = res.board;
  castling = res.castling;
  epTarget = res.ep;
  lastMove = move;
  selected = null;
  legalMoves = [];
  turn = turn === 'w' ? 'b' : 'w';

  updateStatus();
  render();

  const isAI = document.getElementById('mode').value === 'ai';
  if (!gameOver && isAI && turn === 'b') {
    setTimeout(makeAIMove, 250);
  }
}

function evaluateBoard(b) {
  let score = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (!p) continue;
      const val = PIECE_VALUES[p[1]];
      // Slight positional bonus for controlling center
      const centerBonus = (3.5 - Math.abs(3.5 - r)) + (3.5 - Math.abs(3.5 - c));
      score += p[0] === 'b' ? (val + centerBonus * 3) : -(val + centerBonus * 3);
    }
  }
  return score;
}

function minimax(b, depth, alpha, beta, maximizing, castlingRights, ep) {
  const color = maximizing ? 'b' : 'w';
  const moves = getLegalMoves(b, color, castlingRights, ep);

  if (depth === 0 || moves.length === 0) {
    if (moves.length === 0) {
      if (isInCheck(b, color)) return maximizing ? -99999 : 99999;
      return 0;
    }
    return evaluateBoard(b);
  }

  if (maximizing) {
    let maxEval = -Infinity;
    for (const m of moves) {
      const next = applyMoveToState(b, m, castlingRights, 'Q');
      const ev = minimax(next.board, depth - 1, alpha, beta, false, next.castling, next.ep);
      maxEval = Math.max(maxEval, ev);
      alpha = Math.max(alpha, ev);
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (const m of moves) {
      const next = applyMoveToState(b, m, castlingRights, 'Q');
      const ev = minimax(next.board, depth - 1, alpha, beta, true, next.castling, next.ep);
      minEval = Math.min(minEval, ev);
      beta = Math.min(beta, ev);
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

function makeAIMove() {
  const moves = getLegalMoves(board, 'b', castling, epTarget);
  if (moves.length === 0) return;

  let bestMove = moves[0];
  let bestVal = -Infinity;

  // Shuffle moves for variety when scores tie
  moves.sort(() => Math.random() - 0.5);

  for (const m of moves) {
    const next = applyMoveToState(board, m, castling, 'Q');
    const val = minimax(next.board, 2, -Infinity, Infinity, false, next.castling, next.ep);
    if (val > bestVal) {
      bestVal = val;
      bestMove = m;
    }
  }
  executeMove(bestMove, 'Q');
}

function updateStatus() {
  const statusEl = document.getElementById('status');
  const allMoves = getLegalMoves(board, turn, castling, epTarget);
  const check = isInCheck(board, turn);
  const playerName = turn === 'w' ? 'White' : 'Black';

  if (allMoves.length === 0) {
    gameOver = true;
    if (check) {
      statusEl.textContent = `Checkmate! ${turn === 'w' ? 'Black' : 'White'} wins!`;
    } else {
      statusEl.textContent = 'Stalemate! Draw.';
    }
  } else {
    statusEl.textContent = `${playerName}'s Turn` + (check ? ' (Check!)' : '');
  }
}

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const checkColor = isInCheck(board, turn) ? turn : null;

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      sq.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');

      if (selected && selected.r === r && selected.c === c) {
        sq.classList.add('selected');
      }
      if (lastMove && ((lastMove.fr === r && lastMove.fc === c) || (lastMove.tr === r && lastMove.tc === c))) {
        sq.classList.add('last-move');
      }
      if (checkColor && board[r][c] === checkColor + 'K') {
        sq.classList.add('in-check');
      }

      const piece = board[r][c];
      if (piece) {
        const span = document.createElement('span');
        span.className = 'piece ' + (piece[0] === 'w' ? 'white-piece' : 'black-piece');
        span.textContent = PIECES[piece[0]][piece[1]];
        sq.appendChild(span);
      }

      if (legalMoves.some(m => m.tr === r && m.tc === c)) {
        const hint = document.createElement('div');
        hint.className = piece ? 'hint-capture' : 'hint-dot';
        sq.appendChild(hint);
      }

      sq.onclick = () => handleSquareClick(r, c);
      boardEl.appendChild(sq);
    }
  }
}

initGame();
</script>
</body>
</html>
