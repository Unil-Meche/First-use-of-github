<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxelCraft 3D — Dual Stick Mobile Sandbox</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
  }

  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* Crosshair */
  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }

  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 2px rgba(0,0,0,0.8);
  }
  #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
  #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

  /* HUD Top */
  #hud-top {
    position: fixed;
    top: 14px;
    left: 14px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(6px);
    color: #f8fafc;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 10;
  }
  #hud-top strong { color: #38bdf8; }

  /* Hotbar */
  #hotbar {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(8px);
    padding: 6px;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.18);
    z-index: 20;
    max-width: 95vw;
    overflow-x: auto;
    pointer-events: auto;
  }

  .slot {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    background: rgba(30, 41, 59, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .slot.active {
    border-color: #ffffff;
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    background: rgba(51, 65, 85, 0.9);
  }

  .slot canvas {
    width: 24px;
    height: 24px;
    image-rendering: pixelated;
    border-radius: 2px;
  }

  .slot-num {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.75);
  }

  #block-label {
    position: fixed;
    bottom: 78px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 13px;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    z-index: 10;
  }

  /* ==========================================
     ANDROID DUAL CONTROLLER UI STYLES
     ========================================== */
  #mobile-controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 30;
  }

  /* Left Virtual Joystick Area */
  #joystick-base {
    position: absolute;
    bottom: 30px;
    left: 30px;
    width: 130px;
    height: 130px;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
  }

  #joystick-thumb {
    position: absolute;
    top: 39px;
    left: 39px;
    width: 52px;
    height: 52px;
    background: rgba(255, 255, 255, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    pointer-events: none;
    transition: transform 0.05s linear;
  }

  /* Right Side Action Buttons & Look Zone */
  .right-action-cluster {
    position: absolute;
    bottom: 30px;
    right: 30px;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
  }

  .action-row {
    display: flex;
    gap: 12px;
  }

  .act-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.75);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-weight: 800;
    font-size: 11px;
    display: grid;
    place-items: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .act-btn:active { transform: scale(0.9); background: rgba(51, 65, 85, 0.9); }

  /* Start Menu Overlay */
  #menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: white;
    text-align: center;
    padding: 20px;
    pointer-events: auto;
  }

  .menu-box {
    background: rgba(30, 41, 59, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 28px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
  }

  .menu-box h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #4ade80, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .menu-box p { color: #cbd5e1; font-size: 13px; margin-bottom: 16px; }

  .controls-info {
    text-align: left;
    background: rgba(15, 23, 42, 0.7);
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 12px;
    color: #cbd5e1;
    line-height: 1.5;
  }
  .controls-info span { color: #38bdf8; font-weight: 700; }

  .btn-play {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
  }

  .btn-secondary {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    font-size: 12px;
    font-weight: 600;
    color: #e2e8f0;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="crosshair"></div>

  <div id="hud-top">
    <div><strong>VoxelCraft</strong> · FPS: <span id="fps">60</span></div>
    <div>XYZ: <span id="coords">0, 0, 0</span></div>
  </div>

  <div id="block-label">Grass Block</div>
  <div id="hotbar"></div>

  <!-- Android Dual Joystick Controller Overlay -->
  <div id="mobile-controls">
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
    <div class="right-action-cluster">
      <div class="action-row">
        <div class="act-btn" id="btn-jump">JUMP</div>
      </div>
      <div class="action-row">
        <div class="act-btn" id="btn-break" style="background:rgba(225,29,72,0.8);">BREAK</div>
        <div class="act-btn" id="btn-place" style="background:rgba(5,150,105,0.8);">PLACE</div>
      </div>
    </div>
  </div>

  <div id="menu-overlay">
    <div class="menu-box">
      <h1>VoxelCraft 3D</h1>
      <p>Android Dual-Stick Sandbox Edition</p>
      <div class="controls-info">
        <div>🕹️ <span>Left Thumb:</span> Slide inside left circle to walk.</div>
        <div>👁️ <span>Right Screen:</span> Drag anywhere on the right side to look around.</div>
        <div>🔨 <span>Buttons:</span> Tap Jump, Break, or Place.</div>
      </div>
      <button id="start-btn" class="btn-play">Start Game</button>
      <button id="regen-btn" class="btn-secondary">Generate New World</button>
    </div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ==========================================
    // 1. PROCEDURAL TEXTURES & BLOCKS
    // ==========================================
    function createPixelTexture(drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      drawFn(ctx);
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return { tex, canvas };
    }

    function noiseFill(ctx, baseHex, variance) {
      const r = parseInt(baseHex.slice(1, 3), 16);
      const g = parseInt(baseHex.slice(3, 5), 16);
      const b = parseInt(baseHex.slice(5, 7), 16);
      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          const delta = Math.floor((Math.random() - 0.5) * variance);
          ctx.fillStyle = `rgb(${Math.min(255, Math.max(0, r + delta))}, ${Math.min(255, Math.max(0, g + delta))}, ${Math.min(255, Math.max(0, b + delta))})`;
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    const textures = {
      grassTop: createPixelTexture(ctx => noiseFill(ctx, '#56a832', 28)),
      dirt: createPixelTexture(ctx => noiseFill(ctx, '#79553a', 26)),
      grassSide: createPixelTexture(ctx => {
        noiseFill(ctx, '#79553a', 26);
        for (let x = 0; x < 16; x++) {
          const depth = 3 + Math.floor(Math.random() * 3);
          for (let y = 0; y < depth; y++) {
            ctx.fillStyle = y === depth - 1 ? '#458b28' : '#56a832';
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }),
      stone: createPixelTexture(ctx => noiseFill(ctx, '#7d8287', 30)),
      planks: createPixelTexture(ctx => noiseFill(ctx, '#b38b59', 18)),
      woodSide: createPixelTexture(ctx => noiseFill(ctx, '#6b4c2f', 18)),
      woodTop: createPixelTexture(ctx => noiseFill(ctx, '#a48256', 18)),
      leaves: createPixelTexture(ctx => noiseFill(ctx, '#2d7a22', 35)),
      sand: createPixelTexture(ctx => noiseFill(ctx, '#dfd39a', 20)),
      brick: createPixelTexture(ctx => noiseFill(ctx, '#9c4335', 22)),
      glass: createPixelTexture(ctx => {
        ctx.fillStyle = 'rgba(200, 240, 255, 0.3)';
        ctx.fillRect(0, 0, 16, 16);
      })
    };

    const BLOCK_TYPES = [
      { id: 1, name: 'Grass Block', icon: textures.grassSide.canvas, material: [
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassTop.tex }),
        new THREE.MeshLambertMaterial({ map: textures.dirt.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex })
      ]},
      { id: 2, name: 'Dirt', icon: textures.dirt.canvas, material: new THREE.MeshLambertMaterial({ map: textures.dirt.tex }) },
      { id: 3, name: 'Stone', icon: textures.stone.canvas, material: new THREE.MeshLambertMaterial({ map: textures.stone.tex }) },
      { id: 4, name: 'Oak Planks', icon: textures.planks.canvas, material: new THREE.MeshLambertMaterial({ map: textures.planks.tex }) },
      { id: 5, name: 'Oak Log', icon: textures.woodSide.canvas, material: [
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodTop.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodTop.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex })
      ]},
      { id: 6, name: 'Leaves', icon: textures.leaves.canvas, material: new THREE.MeshLambertMaterial({ map: textures.leaves.tex }) },
      { id: 7, name: 'Sand', icon: textures.sand.canvas, material: new THREE.MeshLambertMaterial({ map: textures.sand.tex }) },
      { id: 8, name: 'Bricks', icon: textures.brick.canvas, material: new THREE.MeshLambertMaterial({ map: textures.brick.tex }) },
      { id: 9, name: 'Glass', icon: textures.glass.canvas, material: new THREE.MeshLambertMaterial({ map: textures.glass.tex, transparent: true, opacity: 0.75 }) }
    ];

    // ==========================================
    // 2. SCENE & WORLD GENERATION
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.016);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 150);
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.id = 'game-canvas';
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.68));
    const sunLight = new THREE.DirectionalLight(0xfffbeb, 0.75);
    sunLight.position.set(40, 80, 30);
    scene.add(sunLight);

    const highlightBox = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(1.006, 1.006, 1.006)),
      new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6 })
    );
    highlightBox.visible = false;
    scene.add(highlightBox);

    const WORLD_RADIUS = 18;
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const worldMap = new Map();
    const meshesArray = [];

    function posKey(x, y, z) { return `${x},${y},${z}`; }

    function addBlock(x, y, z, typeId) {
      const key = posKey(x, y, z);
      if (worldMap.has(key)) return;
      const blockDef = BLOCK_TYPES.find(b => b.id === typeId);
      if (!blockDef) return;

      const mesh = new THREE.Mesh(blockGeo, blockDef.material);
      mesh.position.set(x, y, z);
      mesh.userData = { x, y, z, typeId };
      scene.add(mesh);
      worldMap.set(key, { mesh, typeId });
      meshesArray.push(mesh);
    }

    function removeBlock(x, y, z) {
      const key = posKey(x, y, z);
      const entry = worldMap.get(key);
      if (!entry) return;
      scene.remove(entry.mesh);
      const idx = meshesArray.indexOf(entry.mesh);
      if (idx > -1) meshesArray.splice(idx, 1);
      worldMap.delete(key);
    }

    function generateWorld() {
      for (const m of meshesArray) scene.remove(m);
      worldMap.clear();
      meshesArray.length = 0;
      const seed = Math.random() * 1000;

      for (let x = -WORLD_RADIUS; x <= WORLD_RADIUS; x++) {
        for (let z = -WORLD_RADIUS; z <= WORLD_RADIUS; z++) {
          const surfaceY = Math.floor(Math.sin((x + seed) * 0.12) * Math.cos((z + seed) * 0.12) * 4.5 + 4);
          for (let y = 0; y <= surfaceY; y++) {
            addBlock(x, y, z, y === surfaceY ? 1 : 2);
          }
        }
      }
    }

    // ==========================================
    // 3. HOTBAR UI
    // ==========================================
    let selectedSlot = 0;
    const hotbarEl = document.getElementById('hotbar');
    const blockLabelEl = document.getElementById('block-label');

    function initHotbar() {
      hotbarEl.innerHTML = '';
      BLOCK_TYPES.forEach((b, index) => {
        const slot = document.createElement('div');
        slot.className = 'slot' + (index === selectedSlot ? ' active' : '');
        slot.innerHTML = `<span class="slot-num">${index + 1}</span>`;
        const iconCopy = document.createElement('canvas');
        iconCopy.width = 16;
        iconCopy.height = 16;
        iconCopy.getContext('2d').drawImage(b.icon, 0, 0);
        slot.appendChild(iconCopy);
        
        slot.addEventListener('click', (e) => {
          e.stopPropagation();
          selectSlot(index);
        });
        hotbarEl.appendChild(slot);
      });
    }

    function selectSlot(index) {
      selectedSlot = index % BLOCK_TYPES.length;
      document.querySelectorAll('.slot').forEach((el, i) => {
        el.classList.toggle('active', i === selectedSlot);
      });
      blockLabelEl.textContent = BLOCK_TYPES[selectedSlot].name;
    }

    // ==========================================
    // 4. PLAYER & DUAL CONTROLLER LOGIC
    // ==========================================
    const player = {
      pos: new THREE.Vector3(0, 10, 0),
      vel: new THREE.Vector3(0, 0, 0),
      yaw: 0,
      pitch: 0,
      onGround: false,
      height: 1.65,
      radius: 0.3
    };

    const keys = {};
    let isGameStarted = false;

    // Menu Triggers
    const menuOverlay = document.getElementById('menu-overlay');
    document.getElementById('start-btn').addEventListener('click', () => {
      menuOverlay.style.display = 'none';
      isGameStarted = true;
    });
    document.getElementById('regen-btn').addEventListener('click', () => {
      generateWorld();
      menuOverlay.style.display = 'none';
      isGameStarted = true;
    });

    // --- LEFT VIRTUAL JOYSTICK STATE ---
    let joystickTouchId = null;
    let joystickVector = { x: 0, y: 0 };
    const joystickBase = document.getElementById('joystick-base');
    const joystickThumb = document.getElementById('joystick-thumb');

    joystickBase.addEventListener('touchstart', (e) => {
      if (!isGameStarted || joystickTouchId !== null) return;
      const touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
      updateJoystick(touch);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isGameStarted) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
          updateJoystick(touch);
        } else if (touch.identifier === rightLookTouchId) {
          updateRightLook(touch);
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystickTouchId) {
          joystickTouchId = null;
          joystickVector = { x: 0, y: 0 };
          joystickThumb.style.transform = `translate(0px, 0px)`;
        }
        if (touch.identifier === rightLookTouchId) {
          rightLookTouchId = null;
        }
      }
    }, { passive: true });

    function updateJoystick(touch) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxRadius = 45;

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }

      joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
      joystickVector.x = dx / maxRadius;
      joystickVector.y = dy / maxRadius; // Up/Down
    }

    // --- RIGHT LOOK & SWIPE STATE ---
    let rightLookTouchId = null;
    let lastLookX = 0, lastLookY = 0;

    window.addEventListener('touchstart', (e) => {
      if (!isGameStarted) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        // If touch is on right half of screen and not on UI buttons
        if (touch.clientX > window.innerWidth / 2 && rightLookTouchId === null) {
          const target = document.elementFromPoint(touch.clientX, touch.clientY);
          if (target && (target.closest('.right-action-cluster') || target.closest('#hotbar'))) continue;
          
          rightLookTouchId = touch.identifier;
          lastLookX = touch.clientX;
          lastLookY = touch.clientY;
        }
      }
    }, { passive: true });

    function updateRightLook(touch) {
      const dx = touch.clientX - lastLookX;
      const dy = touch.clientY - lastLookY;
      lastLookX = touch.clientX;
      lastLookY = touch.clientY;

      const sensitivity = 0.0038;
      player.yaw -= dx * sensitivity;
      player.pitch -= dy * sensitivity;
      player.pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, player.pitch));
    }

    // Jump, Break, Place Button bindings
    const jumpBtn = document.getElementById('btn-jump');
    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['Space'] = true; }, { passive: false });
    jumpBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys['Space'] = false; }, { passive: false });

    // Desktop Mouse Fallbacks
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    document.addEventListener('mousemove', (e) => {
      if (!isGameStarted || document.pointerLockElement !== renderer.domElement) return;
      player.yaw -= e.movementX * 0.0022;
      player.pitch -= e.movementY * 0.0022;
      player.pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, player.pitch));
    });

    renderer.domElement.addEventListener('click', () => {
      if (isGameStarted && !window.matchMedia('(pointer: coarse)').matches) {
        renderer.domElement.requestPointerLock();
      }
    });

    // Raycaster for Breaking / Placing Blocks
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6.5;

    function getTargetBlock() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(meshesArray);
      return hits.length > 0 ? hits[0] : null;
    }

    function performAction(actionType) {
      const hit = getTargetBlock();
      if (!hit) return;
      const { x, y, z } = hit.object.userData;

      if (actionType === 'break') {
        removeBlock(x, y, z);
      } else if (actionType === 'place') {
        const n = hit.face.normal;
        const nx = x + Math.round(n.x);
        const ny = y + Math.round(n.y);
        const nz = z + Math.round(n.z);
        addBlock(nx, ny, nz, BLOCK_TYPES[selectedSlot].id);
      }
    }

    document.getElementById('btn-break').addEventListener('touchend', (e) => {
      e.preventDefault();
      performAction('break');
    }, { passive: false });

    document.getElementById('btn-place').addEventListener('touchend', (e) => {
      e.preventDefault();
      performAction('place');
    }, { passive: false });

    document.addEventListener('mousedown', (e) => {
      if (!isGameStarted) return;
      if (e.button === 0) performAction('break');
      else if (e.button === 2) performAction('place');
    });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Collision & Physics Loop
    function collidesAt(px, py, pz) {
      const minX = Math.floor(px - player.radius + 0.5);
      const maxX = Math.floor(px + player.radius + 0.5);
      const minY = Math.floor(py - player.height + 0.5);
      const maxY = Math.floor(py + 0.15 + 0.5);
      const minZ = Math.floor(pz - player.radius + 0.5);
      const maxZ = Math.floor(pz + player.radius + 0.5);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (worldMap.has(posKey(x, y, z))) return true;
          }
        }
      }
      return false;
    }

    function updatePlayer(dt) {
      if (!isGameStarted) return;

      const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const moveDir = new THREE.Vector3();

      // Combine keyboard WASD + Mobile Joystick Vector
      let moveX = 0, moveZ = 0;
      if (keys['KeyW']) moveZ += 1;
      if (keys['KeyS']) moveZ -= 1;
      if (keys['KeyD']) moveX += 1;
      if (keys['KeyA']) moveX -= 1;

      // Add joystick vector (joystickVector.y is forward/backward, joystickVector.x is left/right)
      moveZ -= joystickVector.y;
      moveX += joystickVector.x;

      if (moveZ !== 0) moveDir.addScaledVector(forward, moveZ);
      if (moveX !== 0) moveDir.addScaledVector(right, moveX);
      if (moveDir.lengthSq() > 0) moveDir.normalize();

      const speed = 5.2;
      player.vel.x = moveDir.x * speed;
      player.vel.z = moveDir.z * speed;

      player.vel.y -= 24 * dt;
      if (keys['Space'] && player.onGround) {
        player.vel.y = 8.4;
        player.onGround = false;
      }

      const nextX = player.pos.x + player.vel.x * dt;
      if (!collidesAt(nextX, player.pos.y, player.pos.z)) player.pos.x = nextX;

      const nextZ = player.pos.z + player.vel.z * dt;
      if (!collidesAt(player.pos.x, player.pos.y, nextZ)) player.pos.z = nextZ;

      const nextY = player.pos.y + player.vel.y * dt;
      if (!collidesAt(player.pos.x, nextY, player.pos.z)) {
        player.pos.y = nextY;
        player.onGround = false;
      } else {
        if (player.vel.y < 0) player.onGround = true;
        player.vel.y = 0;
      }

      if (player.pos.y < -15) player.pos.set(0, 15, 0);

      camera.position.copy(player.pos);
      camera.quaternion.setFromEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));

      const hit = getTargetBlock();
      if (hit) {
        highlightBox.visible = true;
        highlightBox.position.copy(hit.object.position);
      } else {
        highlightBox.visible = false;
      }

      document.getElementById('coords').textContent = `${Math.round(player.pos.x)}, ${Math.round(player.pos.y)}, ${Math.round(player.pos.z)}`;
    }

    // ==========================================
    // 5. BOOT & ANIMATION LOOP
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    initHotbar();
    generateWorld();

    let lastTime = performance.now();
    let frameCount = 0, fpsTimer = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      frameCount++;
      fpsTimer += dt;
      if (fpsTimer >= 0.5) {
        document.getElementById('fps').textContent = Math.round(frameCount / fpsTimer);
        frameCount = 0; fpsTimer = 0;
      }

      updatePlayer(dt);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
