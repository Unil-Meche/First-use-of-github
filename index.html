<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VoxelCraft Survival Edition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
  }

  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* Crosshair */
  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 3px rgba(0,0,0,0.9);
  }
  #crosshair::before { top: 10px; left: 0; width: 22px; height: 2px; }
  #crosshair::after { top: 0; left: 10px; width: 2px; height: 22px; }

  /* HUD Top */
  #hud-top {
    position: fixed;
    top: 12px;
    left: 12px;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(6px);
    color: #f8fafc;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.4;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 10;
  }
  #hud-top strong { color: #38bdf8; }

  /* Hotbar */
  #hotbar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(8px);
    padding: 6px;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    z-index: 20;
    max-width: 96vw;
    overflow-x: auto;
    pointer-events: auto;
  }

  .slot {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    background: rgba(30, 41, 59, 0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .slot.active {
    border-color: #ffffff;
    transform: translateY(-2px) scale(1.06);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
    background: rgba(51, 65, 85, 0.95);
  }

  .slot canvas {
    width: 22px;
    height: 22px;
    image-rendering: pixelated;
    border-radius: 2px;
  }

  .slot-num {
    position: absolute;
    top: 1px;
    left: 3px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.75);
  }

  #block-label {
    position: fixed;
    bottom: 74px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 12px;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    z-index: 10;
  }

  /* Mobile Controls */
  #mobile-controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 30;
  }

  .touch-pad {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 130px;
    height: 130px;
    pointer-events: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
  }

  .t-btn {
    background: rgba(255, 255, 255, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    color: white;
    font-weight: 800;
    font-size: 16px;
    display: grid;
    place-items: center;
    backdrop-filter: blur(4px);
  }
  .t-btn:active, .t-btn.touched { background: rgba(255, 255, 255, 0.65); transform: scale(0.94); }
  .t-up { grid-column: 2; grid-row: 1; }
  .t-left { grid-column: 1; grid-row: 2; }
  .t-right { grid-column: 3; grid-row: 2; }
  .t-down { grid-column: 2; grid-row: 3; }

  .action-pad {
    position: absolute;
    bottom: 20px;
    right: 20px;
    pointer-events: auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .col-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .act-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.75);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-weight: 800;
    font-size: 10px;
    display: grid;
    place-items: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .act-btn:active { transform: scale(0.9); }

  /* Start Menu Overlay */
  #menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: white;
    text-align: center;
    padding: 20px;
    pointer-events: auto;
  }

  .menu-box {
    background: rgba(30, 41, 59, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 24px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  }

  .menu-box h1 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #4ade80, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .menu-box p { color: #cbd5e1; font-size: 12px; margin-bottom: 14px; }

  .controls-info {
    text-align: left;
    background: rgba(15, 23, 42, 0.75);
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 11px;
    color: #cbd5e1;
    line-height: 1.5;
  }
  .controls-info span { color: #38bdf8; font-weight: 700; }

  .btn-play {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
  }

  .btn-secondary {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    font-size: 11px;
    font-weight: 600;
    color: #e2e8f0;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="crosshair"></div>

  <div id="hud-top">
    <div><strong>VoxelCraft</strong> · FPS: <span id="fps">60</span></div>
    <div>XYZ: <span id="coords">0, 0, 0</span></div>
  </div>

  <div id="block-label">Grass Block</div>
  <div id="hotbar"></div>

  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <div class="touch-pad">
      <div class="t-btn t-up" id="btn-w">▲</div>
      <div class="t-btn t-left" id="btn-a">◀</div>
      <div class="t-btn t-right" id="btn-d">▶</div>
      <div class="t-btn t-down" id="btn-s">▼</div>
    </div>
    <div class="action-pad">
      <div class="col-actions">
        <div class="act-btn" id="btn-break" style="background:rgba(225,29,72,0.85);">MINE</div>
        <div class="act-btn" id="btn-place" style="background:rgba(5,150,105,0.85);">PLACE</div>
      </div>
      <div class="act-btn" id="btn-jump" style="width:68px; height:68px; background:rgba(37,99,235,0.85);">JUMP</div>
    </div>
  </div>

  <div id="menu-overlay">
    <div class="menu-box">
      <h1>VoxelCraft 3D</h1>
      <p>Survival & Tools Edition</p>
      <div class="controls-info">
        <div>🕹️ <span>Move:</span> Left D-Pad (▲ ◀ ▶ ▼).</div>
        <div>👁️ <span>Look:</span> Drag finger on screen.</div>
        <div>⛏️ <span>Tools:</span> Pickaxe, Axe, Shovel, Dagger have different HP & damage!</div>
      </div>
      <button id="start-btn" class="btn-play">Enter Fullscreen & Play</button>
      <button id="regen-btn" class="btn-secondary">Generate New World</button>
    </div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ==========================================
    // 1. PROCEDURAL TEXTURES & BLOCKS WITH HP
    // ==========================================
    function createPixelTexture(drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      drawFn(ctx);
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return { tex, canvas };
    }

    function noiseFill(ctx, baseHex, variance) {
      const r = parseInt(baseHex.slice(1, 3), 16);
      const g = parseInt(baseHex.slice(3, 5), 16);
      const b = parseInt(baseHex.slice(5, 7), 16);
      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          const delta = Math.floor((Math.random() - 0.5) * variance);
          ctx.fillStyle = `rgb(${Math.min(255, Math.max(0, r + delta))}, ${Math.min(255, Math.max(0, g + delta))}, ${Math.min(255, Math.max(0, b + delta))})`;
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    const textures = {
      grassTop: createPixelTexture(ctx => noiseFill(ctx, '#56a832', 28)),
      dirt: createPixelTexture(ctx => noiseFill(ctx, '#79553a', 26)),
      grassSide: createPixelTexture(ctx => {
        noiseFill(ctx, '#79553a', 26);
        for (let x = 0; x < 16; x++) {
          const depth = 3 + Math.floor(Math.random() * 3);
          for (let y = 0; y < depth; y++) {
            ctx.fillStyle = y === depth - 1 ? '#458b28' : '#56a832';
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }),
      stone: createPixelTexture(ctx => noiseFill(ctx, '#7d8287', 30)),
      planks: createPixelTexture(ctx => noiseFill(ctx, '#b38b59', 18)),
      woodSide: createPixelTexture(ctx => noiseFill(ctx, '#6b4c2f', 18)),
      woodTop: createPixelTexture(ctx => noiseFill(ctx, '#a48256', 18)),
      leaves: createPixelTexture(ctx => noiseFill(ctx, '#2d7a22', 35)),
      sand: createPixelTexture(ctx => noiseFill(ctx, '#dfd39a', 20)),
      brick: createPixelTexture(ctx => noiseFill(ctx, '#9c4335', 22)),
      glass: createPixelTexture(ctx => {
        ctx.fillStyle = 'rgba(200, 240, 255, 0.3)';
        ctx.fillRect(0, 0, 16, 16);
      }),
      // Tool Icons
      dagger: createPixelTexture(ctx => {
        noiseFill(ctx, '#c0c0c0', 10);
        ctx.fillStyle = '#5c4033'; ctx.fillRect(7, 12, 2, 4);
      }),
      pickaxe: createPixelTexture(ctx => {
        noiseFill(ctx, '#888888', 15);
        ctx.fillStyle = '#79553a'; ctx.fillRect(4, 7, 8, 2);
      }),
      axe: createPixelTexture(ctx => {
        noiseFill(ctx, '#79553a', 10);
        ctx.fillStyle = '#a0a0a0'; ctx.fillRect(10, 2, 4, 6);
      }),
      shovel: createPixelTexture(ctx => {
        noiseFill(ctx, '#79553a', 10);
        ctx.fillStyle = '#999999'; ctx.fillRect(11, 1, 4, 5);
      })
    };

    // BLOCK & ITEM DEFINITIONS WITH HP AND PROPER TOOL MULTIPLIERS
    const BLOCK_TYPES = [
      { id: 1, name: 'Grass Block', type: 'block', hp: 3, preferredTool: 'shovel', icon: textures.grassSide.canvas, material: [
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassTop.tex }),
        new THREE.MeshLambertMaterial({ map: textures.dirt.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.grassSide.tex })
      ]},
      { id: 2, name: 'Dirt', type: 'block', hp: 2, preferredTool: 'shovel', icon: textures.dirt.canvas, material: new THREE.MeshLambertMaterial({ map: textures.dirt.tex }) },
      { id: 3, name: 'Stone', type: 'block', hp: 8, preferredTool: 'pickaxe', icon: textures.stone.canvas, material: new THREE.MeshLambertMaterial({ map: textures.stone.tex }) },
      { id: 4, name: 'Oak Planks', type: 'block', hp: 5, preferredTool: 'axe', icon: textures.planks.canvas, material: new THREE.MeshLambertMaterial({ map: textures.planks.tex }) },
      { id: 5, name: 'Oak Log', type: 'block', hp: 6, preferredTool: 'axe', icon: textures.woodSide.canvas, material: [
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodTop.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodTop.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex }),
        new THREE.MeshLambertMaterial({ map: textures.woodSide.tex })
      ]},
      { id: 6, name: 'Leaves', type: 'block', hp: 1, preferredTool: 'axe', icon: textures.leaves.canvas, material: new THREE.MeshLambertMaterial({ map: textures.leaves.tex }) },
      { id: 7, name: 'Sand', type: 'block', hp: 2, preferredTool: 'shovel', icon: textures.sand.canvas, material: new THREE.MeshLambertMaterial({ map: textures.sand.tex }) },
      { id: 8, name: 'Bricks', type: 'block', hp: 10, preferredTool: 'pickaxe', icon: textures.brick.canvas, material: new THREE.MeshLambertMaterial({ map: textures.brick.tex }) },
      { id: 9, name: 'Glass', type: 'block', hp: 1, preferredTool: null, icon: textures.glass.canvas, material: new THREE.MeshLambertMaterial({ map: textures.glass.tex, transparent: true, opacity: 0.75 }) },
      // Tools & Weapons (Can be held in hotbar & used)
      { id: 10, name: 'Dagger (Atk: 4)', type: 'tool', toolType: 'dagger', damage: 4, icon: textures.dagger.canvas },
      { id: 11, name: 'Wooden Pickaxe', type: 'tool', toolType: 'pickaxe', damage: 2, miningSpeed: 3.5, icon: textures.pickaxe.canvas },
      { id: 12, name: 'Wood Axe', type: 'tool', toolType: 'axe', damage: 3, miningSpeed: 3.5, icon: textures.axe.canvas },
      { id: 13, name: 'Shovel', type: 'tool', toolType: 'shovel', damage: 1.5, miningSpeed: 3.5, icon: textures.shovel.canvas }
    ];

    // ==========================================
    // 2. SCENE & WORLD GENERATION
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.016);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 150);
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.id = 'game-canvas';
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.68));
    const sunLight = new THREE.DirectionalLight(0xfffbeb, 0.75);
    sunLight.position.set(40, 80, 30);
    scene.add(sunLight);

    const highlightBox = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(1.006, 1.006, 1.006)),
      new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6 })
    );
    highlightBox.visible = false;
    scene.add(highlightBox);

    const WORLD_RADIUS = 16;
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const worldMap = new Map(); // Stores block data & current HP
    const meshesArray = [];

    function posKey(x, y, z) { return `${x},${y},${z}`; }

    function addBlock(x, y, z, typeId) {
      const key = posKey(x, y, z);
      if (worldMap.has(key)) return;
      const blockDef = BLOCK_TYPES.find(b => b.id === typeId && b.type === 'block');
      if (!blockDef) return;

      const mesh = new THREE.Mesh(blockGeo, blockDef.material);
      mesh.position.set(x, y, z);
      mesh.userData = { x, y, z, typeId };
      scene.add(mesh);
      
      worldMap.set(key, { 
        mesh, 
        typeId, 
        hp: blockDef.hp, 
        maxHp: blockDef.hp 
      });
      meshesArray.push(mesh);
    }

    function removeBlock(x, y, z) {
      const key = posKey(x, y, z);
      const entry = worldMap.get(key);
      if (!entry) return;
      scene.remove(entry.mesh);
      const idx = meshesArray.indexOf(entry.mesh);
      if (idx > -1) meshesArray.splice(idx, 1);
      worldMap.delete(key);
    }

    function generateWorld() {
      for (const m of meshesArray) scene.remove(m);
      worldMap.clear();
      meshesArray.length = 0;
      const seed = Math.random() * 1000;

      for (let x = -WORLD_RADIUS; x <= WORLD_RADIUS; x++) {
        for (let z = -WORLD_RADIUS; z <= WORLD_RADIUS; z++) {
          const surfaceY = Math.floor(Math.sin((x + seed) * 0.12) * Math.cos((z + seed) * 0.12) * 4.5 + 4);
          for (let y = 0; y <= surfaceY; y++) {
            addBlock(x, y, z, y === surfaceY ? 1 : 2);
          }
        }
      }
    }

    // ==========================================
    // 3. HOTBAR UI
    // ==========================================
    let selectedSlot = 0;
    const hotbarEl = document.getElementById('hotbar');
    const blockLabelEl = document.getElementById('block-label');

    function initHotbar() {
      hotbarEl.innerHTML = '';
      BLOCK_TYPES.forEach((b, index) => {
        const slot = document.createElement('div');
        slot.className = 'slot' + (index === selectedSlot ? ' active' : '');
        slot.innerHTML = `<span class="slot-num">${index + 1}</span>`;
        const iconCopy = document.createElement('canvas');
        iconCopy.width = 16;
        iconCopy.height = 16;
        iconCopy.getContext('2d').drawImage(b.icon, 0, 0);
        slot.appendChild(iconCopy);
        
        slot.addEventListener('click', (e) => {
          e.stopPropagation();
          selectSlot(index);
        });
        hotbarEl.appendChild(slot);
      });
    }

    function selectSlot(index) {
      selectedSlot = index % BLOCK_TYPES.length;
      document.querySelectorAll('.slot').forEach((el, i) => {
        el.classList.toggle('active', i === selectedSlot);
      });
      blockLabelEl.textContent = BLOCK_TYPES[selectedSlot].name;
    }

    // ==========================================
    // 4. PLAYER & CONTROLLER LOGIC
    // ==========================================
    const player = {
      pos: new THREE.Vector3(0, 10, 0),
      vel: new THREE.Vector3(0, 0, 0),
      yaw: 0,
      pitch: 0,
      onGround: false,
      height: 1.65,
      radius: 0.3
    };

    const keys = {};
    let isGameStarted = false;

    function requestFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    const menuOverlay = document.getElementById('menu-overlay');
    document.getElementById('start-btn').addEventListener('click', () => {
      requestFullscreen();
      menuOverlay.style.display = 'none';
      isGameStarted = true;
    });
    document.getElementById('regen-btn').addEventListener('click', () => {
      requestFullscreen();
      generateWorld();
      menuOverlay.style.display = 'none';
      isGameStarted = true;
    });

    // Mobile D-Pad binding
    function bindTouchButton(elementId, keyName) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        keys[keyName] = true;
        el.classList.add('touched');
      }, { passive: false });

      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        keys[keyName] = false;
        el.classList.remove('touched');
      }, { passive: false });
    }

    bindTouchButton('btn-w', 'KeyW');
    bindTouchButton('btn-a', 'KeyA');
    bindTouchButton('btn-s', 'KeyS');
    bindTouchButton('btn-d', 'KeyD');
    bindTouchButton('btn-jump', 'Space');

    // Swipe to look around
    let lookTouchId = null;
    let lastX = 0, lastY = 0;

    window.addEventListener('touchstart', (e) => {
      if (!isGameStarted) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const target = document.elementFromPoint(t.clientX, t.clientY);
        if (target && (target.closest('#mobile-controls') || target.closest('#hotbar'))) continue;
        
        if (lookTouchId === null) {
          lookTouchId = t.identifier;
          lastX = t.clientX;
          lastY = t.clientY;
          break;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isGameStarted || lookTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === lookTouchId) {
          const dx = t.clientX - lastX;
          const dy = t.clientY - lastY;
          lastX = t.clientX;
          lastY = t.clientY;

          const sensitivity = 0.0035;
          player.yaw -= dx * sensitivity;
          player.pitch -= dy * sensitivity;
          player.pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, player.pitch));
          break;
        }
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) {
          lookTouchId = null;
          break;
        }
      }
    }, { passive: true });

    // ==========================================
    // 5. MINING, BLOCK HP & TOOL DAMAGE LOGIC
    // ==========================================
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6.5;

    function getTargetBlock() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(meshesArray);
      return hits.length > 0 ? hits[0] : null;
    }

    function performAction(actionType) {
      const hit = getTargetBlock();
      if (!hit) return;
      const { x, y, z } = hit.object.userData;
      const key = posKey(x, y, z);
      const entry = worldMap.get(key);
      if (!entry) return;

      const activeItem = BLOCK_TYPES[selectedSlot];

      if (actionType === 'break') {
        if (activeItem.type === 'tool' && activeItem.toolType === 'dagger') {
          // Dagger doesn't mine blocks well, deals low damage
          entry.hp -= 1;
        } else {
          // Calculate mining power based on active tool vs block preference
          const blockDef = BLOCK_TYPES.find(b => b.id === entry.typeId);
          let damage = 1;
          if (activeItem.type === 'tool' && activeItem.toolType === blockDef.preferredTool) {
            damage = activeItem.miningSpeed || 2.5;
          }
          entry.hp -= damage;
        }

        // Visual damage feedback (shrink block slightly as HP drops)
        const scaleFactor = Math.max(0.3, entry.hp / entry.maxHp);
        entry.mesh.scale.set(scaleFactor, scaleFactor, scaleFactor);

        if (entry.hp <= 0) {
          removeBlock(x, y, z);
        }
      } else if (actionType === 'place') {
        // Can only place if selected item is a block
        if (activeItem.type === 'block') {
          const n = hit.face.normal;
          const nx = x + Math.round(n.x);
          const ny = y + Math.round(n.y);
          const nz = z + Math.round(n.z);
          addBlock(nx, ny, nz, activeItem.id);
        }
      }
    }

    document.getElementById('btn-break').addEventListener('touchend', (e) => {
      e.preventDefault();
      performAction('break');
    }, { passive: false });

    document.getElementById('btn-place').addEventListener('touchend', (e) => {
      e.preventDefault();
      performAction('place');
    }, { passive: false });

    // Collision & Physics Loop
    function collidesAt(px, py, pz) {
      const minX = Math.floor(px - player.radius + 0.5);
      const maxX = Math.floor(px + player.radius + 0.5);
      const minY = Math.floor(py - player.height + 0.5);
      const maxY = Math.floor(py + 0.15 + 0.5);
      const minZ = Math.floor(pz - player.radius + 0.5);
      const maxZ = Math.floor(pz + player.radius + 0.5);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (worldMap.has(posKey(x, y, z))) return true;
          }
        }
      }
      return false;
    }

    function updatePlayer(dt) {
      if (!isGameStarted) return;

      const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const moveDir = new THREE.Vector3();

      if (keys['KeyW']) moveDir.add(forward);
      if (keys['KeyS']) moveDir.sub(forward);
      if (keys['KeyD']) moveDir.add(right);
      if (keys['KeyA']) moveDir.sub(right);
      if (moveDir.lengthSq() > 0) moveDir.normalize();

      const speed = 5.2;
      player.vel.x = moveDir.x * speed;
      player.vel.z = moveDir.z * speed;

      player.vel.y -= 24 * dt;
      if (keys['Space'] && player.onGround) {
        player.vel.y = 8.4;
        player.onGround = false;
      }

      const nextX = player.pos.x + player.vel.x * dt;
      if (!collidesAt(nextX, player.pos.y, player.pos.z)) player.pos.x = nextX;

      const nextZ = player.pos.z + player.vel.z * dt;
      if (!collidesAt(player.pos.x, player.pos.y, nextZ)) player.pos.z = nextZ;

      const nextY = player.pos.y + player.vel.y * dt;
      if (!collidesAt(player.pos.x, nextY, player.pos.z)) {
        player.pos.y = nextY;
        player.onGround = false;
      } else {
        if (player.vel.y < 0) player.onGround = true;
        player.vel.y = 0;
      }

      if (player.pos.y < -15) player.pos.set(0, 15, 0);

      camera.position.copy(player.pos);
      camera.quaternion.setFromEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));

      const hit = getTargetBlock();
      if (hit) {
        highlightBox.visible = true;
        highlightBox.position.copy(hit.object.position);
      } else {
        highlightBox.visible = false;
      }

      document.getElementById('coords').textContent = `${Math.round(player.pos.x)}, ${Math.round(player.pos.y)}, ${Math.round(player.pos.z)}`;
    }

    // ==========================================
    // 6. BOOT & LOOP
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    initHotbar();
    selectSlot(0);
    generateWorld();

    let lastTime = performance.now();
    let frameCount = 0, fpsTimer = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      frameCount++;
      fpsTimer += dt;
      if (fpsTimer >= 0.5) {
        document.getElementById('fps').textContent = Math.round(frameCount / fpsTimer);
        frameCount = 0; fpsTimer = 0;
      }

      updatePlayer(dt);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
